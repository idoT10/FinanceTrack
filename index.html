      '<div class="lg-row"><span class="lg-name">הכנסות</span><span class="lg-bar"><i class="inc" style="width:'+(inc/max*100)+'%"></i></span><b>'+money(inc)+'</b></div>'+
      '<div class="lg-row"><span class="lg-name">הוצאות</span><span class="lg-bar"><i class="exp" style="width:'+(exp/max*100)+'%"></i></span><b>'+money(exp)+'</b></div>'+
    '</div>'+hint+'</section>';

  const t=nwTotals(),pts=rangePoints();
  h+='<section class="panel"><div class="row between"><h2 class="h">שווי נקי</h2><button class="link" data-a="nav" data-v="nw">פירוט נכסים</button></div>'+
    '<div class="big">'+money(t.n)+'</div><div class="delta">'+deltaHtml(pts)+'</div>'+
    '<div class="chart" data-chart="home" data-h="150"></div>'+rangeSeg()+'</section>';

  const sums={};
  for(const x of monthTx)if(x.type==='expense'){const k=catKey(x);sums[k]=(sums[k]||0)+x.amount;}
  const top=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]).slice(0,4);
  if(top.length){
    h+='<div class="sec-h"><h3>לאן הלך הכסף החודש</h3><button class="link" data-a="go" data-v="tx">כל התנועות</button></div>'+
      '<div class="surface">'+top.map(id=>barRow(id,sums[id],exp,'go',' data-v="tx" data-cat="'+esc(id)+'"')).join('')+'</div>';
  }
  const recent=S.tx.transactions.filter(txVisible).sort(sortTx).slice(0,5);
  h+='<div class="sec-h"><h3>תנועות אחרונות</h3></div>';
  h+=recent.length
    ?'<div class="surface list">'+recent.map(x=>txRow(x,true)).join('')+'</div>'
    :'<div class="surface empty">כאן יופיעו ההוצאות וההכנסות שתוסיף.<br><button class="btn primary" data-a="fab">הוספת תנועה</button></div>';
  return h;
}

function txMonthData(){
  const mk=S.month,monthTx=S.tx.transactions.filter(t=>t.date.slice(0,7)===mk&&txVisible(t));
  const typed=S.txType==='all'?monthTx:S.txType==='transfer'?monthTx.filter(t=>!isFlow(t)):monthTx.filter(t=>t.type===S.txType);
  const ofAcct=t=>!S.txAcct||t.accountId===S.txAcct||t.fromId===S.txAcct||t.toId===S.txAcct;
  const list=(S.txCat?typed.filter(t=>catKey(t)===S.txCat):typed).filter(ofAcct).filter(t=>matchQ(t,S.txQ)).sort(sortTx);
  return{mk,monthTx,typed,list,tot:sumTx(monthTx)};
}
function viewTx(){
  const {mk,monthTx,typed,tot}=txMonthData(),cur=monthKey(new Date());
  const sums={};
  for(const t of typed)if(isFlow(t)){const k=catKey(t);sums[k]=(sums[k]||0)+t.amount;}
  const ids=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]);
  if(S.txCat&&!ids.includes(S.txCat))ids.unshift(S.txCat);

  let h='<div class="month-sw"><button class="icon-btn" data-a="month" data-v="-1" aria-label="חודש קודם">'+ICON.chevR+'</button>'+
    '<div class="mname">'+esc(monthName(mk))+(mk!==cur?'<div><button class="link small" data-a="month" data-v="0">חזרה לחודש הנוכחי</button></div>':'')+'</div>'+
    '<button class="icon-btn" data-a="month" data-v="1" aria-label="חודש הבא">'+ICON.chevL+'</button></div>';
  h+='<div class="tri"><div><span>הכנסות</span><b class="pos">'+money(tot.inc)+'</b></div><div><span>הוצאות</span><b class="neg">'+money(tot.exp)+'</b></div><div><span>תזרים</span><b>'+money(tot.net,{sign:true})+'</b></div></div>';
  if(monthTx.length&&tot.inc>0){
    const sr=saveRate(tot.inc,tot.exp);
    h+='<div class="tx-save-rate">'+(sr.rate===null?'ההוצאות עולות על ההכנסות':'שיעור חיסכון <b>'+sr.rate+'%</b>')+'</div>';
  }
  h+='<div class="search"><input class="input" id="tx-search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" '+
    'placeholder="חיפוש בהערה, קטגוריה או סכום" aria-label="חיפוש תנועות בחודש" value="'+esc(S.txQ)+'">'+
    '<button class="search-x" data-a="tx-q-clear" aria-label="ניקוי החיפוש"'+(S.txQ?'':' hidden')+'>✕</button></div>';
  h+='<div class="seg">'+[['all','הכל',''],['expense','הוצאות','exp'],['income','הכנסות','inc'],['transfer','העברות','']].map(([v,l,c])=>
    '<button data-a="tx-type" data-v="'+v+'" class="'+(S.txType===v?'on '+c:'')+'">'+l+'</button>').join('')+'</div>';

  // סינון לפי חשבון: שבב אחד בתחילת השורה. לחיצה פותחת בחירה; כשנבחר חשבון, לחיצה מנקה
  if(S.txAcct&&!acctOf(S.txAcct))S.txAcct=null;
  const fa=acctOf(S.txAcct);
  const acctChipHtml=!allAccts().length?'':fa
    ?'<button class="chip on" style="--c:'+acctCat(fa).color+'" data-a="tx-acct-clear" aria-label="ביטול הסינון לפי חשבון">'+esc(acctCat(fa).icon)+' '+esc(fa.x.name)+' ✕</button>'
    :'<button class="chip" data-a="tx-acct">חשבון ▾</button>';
  if(ids.length||acctChipHtml){
    h+='<div class="chips scroll">'+acctChipHtml+(!ids.length?'':'<button class="chip '+(!S.txCat?'on':'')+'" data-a="tx-cat" data-id="">כל הקטגוריות</button>')+
      ids.map(id=>{const c=catView(id);return '<button class="chip '+(S.txCat===id?'on':'')+'" style="--c:'+c.color+'" data-a="tx-cat" data-id="'+esc(id)+'">'+esc(c.icon)+' '+esc(c.name)+'</button>';}).join('')+'</div>';
  }
  return h+'<div id="tx-results">'+txResults()+'</div>';
}
/* החלק שמתעדכן בזמן הקלדה בחיפוש (בלי לצייר מחדש את שדה החיפוש, כדי שהמקלדת לא תיסגר) */
function txResults(){
  const {mk,monthTx,list,tot}=txMonthData(),q=S.txQ.trim();
  let h='';
  const fa=acctOf(S.txAcct);
  if((S.txCat||S.txType!=='all'||q||fa)&&list.length){
    const s=r2(list.reduce((x,t)=>x+t.amount,0));
    h+='<div class="filter-sum">'+(list.length===1?'תנועה אחת':list.length+' תנועות')+(q?' מתאימות לחיפוש':' בסינון')+(fa?'':', בסך '+money(s,{dec:true}))+
      (fa?' · יתרה ב'+esc(fa.x.name)+': '+money(fa.kind==='liab'?-fa.x.value:fa.x.value,{dec:true}):'')+'</div>';
  }

  const btype=S.txType==='income'?'income':'expense';
  if(!S.txCat&&!q&&!fa&&S.txType!=='transfer'){
    const bs={};
    for(const t of monthTx)if(t.type===btype){const k=catKey(t);bs[k]=(bs[k]||0)+t.amount;}
    const bids=Object.keys(bs).sort((a,b)=>bs[b]-bs[a]);
    if(bids.length>1){
      // סגור: פס צבעים אחד ושלוש הגדולות. פתוח: שורה לכל קטגוריה (לחיצה על שורה מסננת)
      const total=btype==='income'?tot.inc:tot.exp;
      h+='<div class="sec-h"><h3>'+(btype==='income'?'פילוח הכנסות':'פילוח הוצאות')+'</h3><button class="link" data-a="brk-toggle">'+(S.brkOpen?'הסתרה':'פירוט')+'</button></div>';
      h+=S.brkOpen
        ?'<div class="surface">'+bids.map(id=>barRow(id,bs[id],total,'tx-cat')).join('')+'</div>'
        :'<button class="surface brk-mini" data-a="brk-toggle" aria-label="הצגת הפילוח המלא"><span class="stack">'+bids.map(id=>'<i style="flex-grow:'+bs[id]+';background:'+catView(id).color+'"></i>').join('')+'</span>'+
          '<span class="legend">'+bids.slice(0,3).map(id=>{const c=catView(id);return '<span><i style="background:'+c.color+'"></i>'+esc(c.name)+' <span class="num">'+pct(bs[id],total)+'%</span></span>';}).join('')+
          (bids.length>3?'<span>ועוד '+(bids.length-3)+'</span>':'')+'</span></button>';
    }
  }

  if(!S.monthLoaded[mk]){
    h+='<div class="skel" style="height:64px;margin-top:16px"></div><div class="skel" style="height:64px"></div><div class="skel" style="height:64px"></div>';
  }else if(!monthTx.length&&S.monthCache[mk]&&navigator.onLine===false){
    h+='<div class="surface empty" style="margin-top:16px">החודש הזה לא זמין בלי חיבור לאינטרנט.</div>';
  }else if(!monthTx.length){
    h+='<div class="surface empty" style="margin-top:16px">אין תנועות ב'+esc(monthName(mk))+'.<br><button class="btn primary" data-a="fab">הוספת תנועה</button></div>';
  }else if(!list.length){
    h+='<div class="surface empty" style="margin-top:16px">'+(q?'לא נמצאו תנועות ב'+esc(monthName(mk))+'.':'אין תנועות שמתאימות לסינון.')+'<br><button class="btn ghost" data-a="tx-clear">ניקוי '+(q?'החיפוש והסינון':'סינון')+'</button></div>';
  }else{
    const groups=[];
    for(const t of list){
      let g=groups[groups.length-1];
      if(!g||g.date!==t.date){g={date:t.date,items:[],net:0};groups.push(g);}
      g.items.push(t);g.net+=flowSigned(t);
    }
    h+=groups.map(g=>'<div class="day-h"><span>'+esc(dayLabel(g.date))+'</span>'+money(r2(g.net),{sign:true,dec:true})+'</div>'+
      '<div class="surface list">'+g.items.map(t=>txRow(t,false)).join('')+'</div>').join('');
  }
  return h;
}
function updateTxResults(){
  const r=$('#tx-results');if(!r)return;
  r.innerHTML=txResults();
  const x=$('#view .search-x');if(x)x.hidden=!S.txQ;
}

function viewNw(){
  const t=nwTotals(),pts=rangePoints();
  let h='<section class="panel"><div class="row between"><h2 class="h">שווי נקי</h2>'+(S.nw.assets.length+S.nw.liabilities.length?'<button class="link" data-a="nw-bulk">עדכון מלא</button>':'')+'</div><div class="big">'+money(t.n)+'</div><div class="delta">'+deltaHtml(pts)+'</div>'+
    '<div class="nw-split"><div><span>נכסים</span><b>'+money(t.a)+'</b></div><div><span>התחייבויות</span><b>'+money(t.l)+'</b></div></div></section>';
  h+='<div class="sec-h"><h3>מגמה</h3>'+rangeSeg()+'</div><div class="surface"><div class="chart" data-chart="nw" data-h="200" style="margin-top:4px"></div></div>';

  // כסף שוטף: עו"ש, מזומן/ארנק וכרטיסי אשראי. היתרה מתעדכנת מהתנועות
  const liveA=S.nw.assets.filter(x=>acctGroup('asset',x.category)==='live'),liveL=S.nw.liabilities.filter(x=>acctGroup('liab',x.category)==='live');
  const liveSum=r2(liveA.reduce((s,x)=>s+x.value,0)-liveL.reduce((s,x)=>s+x.value,0));
  h+='<div class="sec-h"><h3>כסף שוטף</h3><button class="link" data-a="asset-add" data-v="checking">＋ הוספה</button></div>';
  if(liveA.length+liveL.length)h+='<p class="hint" style="margin:-4px 2px 8px">'+GROUPS[0].hint+'</p>';
  h+=liveA.length+liveL.length
    ?'<div class="surface list">'+liveA.map(x=>nwRow(x,'asset',ASSET_CATS.find(c=>c.id===x.category))).join('')+
      liveL.map(x=>nwRow(x,'liab',LIAB_CATS.find(c=>c.id===x.category))).join('')+
      '<div class="grp-h" style="padding-top:10px"><span>סה"כ</span>'+money(liveSum)+'</div></div>'
    :'<div class="surface empty">עו"ש, מזומן, ביט או כרטיס אשראי. היתרה שלהם תתעדכן לבד מההוצאות וההכנסות.<br><button class="btn primary" data-a="asset-add" data-v="checking">הוספת חשבון</button></div>';

  // חיסכון והשקעות
  const saveA=S.nw.assets.filter(x=>acctGroup('asset',x.category)==='save'),saveSum=r2(saveA.reduce((s,x)=>s+x.value,0));
  h+='<div class="sec-h"><h3>חיסכון והשקעות</h3><button class="link" data-a="asset-add" data-v="deposit">＋ הוספה</button></div>';
  if(!saveA.length){
    h+='<div class="surface empty">קופת גמל, קרן השתלמות, פנסיה, תיק מסחר או פיקדון.<br><button class="btn primary" data-a="asset-add" data-v="deposit">הוספה</button></div>';
  }else{
    const groups=ASSET_CATS.map(c=>{
      const items=saveA.filter(x=>x.category===c.id).sort((a,b)=>b.value-a.value);
      return{c,items,sum:r2(items.reduce((s,x)=>s+x.value,0))};
    }).filter(g=>g.items.length);
    const pos=groups.filter(g=>g.sum>0);
    const stack=saveSum>0&&groups.length>1?'<div class="stack">'+pos.map(g=>'<i style="flex-grow:'+g.sum+';background:'+g.c.color+'"></i>').join('')+'</div>'+
      '<div class="legend">'+pos.map(g=>'<span><i style="background:'+g.c.color+'"></i>'+esc(g.c.name)+' <span class="num">'+pct(g.sum,saveSum)+'%</span></span>').join('')+'</div>':'';
    h+='<div class="surface" style="padding-top:14px;padding-bottom:4px">'+stack+groups.map(g=>
      // סוג עם פריט אחד: בלי כותרת (היא הייתה חוזרת על אותו סכום), שם הסוג עובר לשורה
      g.items.length>1?'<div class="grp-h"><span>'+g.c.icon+' '+esc(g.c.name)+'</span>'+money(g.sum)+'</div>'+g.items.map(x=>nwRow(x,'asset',g.c)).join(''):nwRow(g.items[0],'asset',g.c,true)).join('')+'</div>';
  }

  // חובות
  const debtL=S.nw.liabilities.filter(x=>acctGroup('liab',x.category)==='debt'),committed=committedInst();
  h+='<div class="sec-h"><h3>חובות</h3><button class="link" data-a="liab-add">＋ הוספה</button></div>';
  h+=debtL.length
    ?'<div class="surface list">'+debtL.slice().sort((a,b)=>b.value-a.value).map(x=>nwRow(x,'liab',LIAB_CATS.find(c=>c.id===x.category)||LIAB_CATS[3])).join('')+'</div>'
    :'<div class="surface empty">אין חובות רשומים.</div>';
  if(committed)h+='<p class="hint" style="margin:8px 2px 0">מחויב לחודשים הבאים מתשלומים: <b>'+money(committed)+'</b> (לא נכלל בשווי הנקי)</p>';

  const hist=S.nw.history;
  if(hist.length){
    const rows=hist.map((p,i)=>({p,prev:hist[i-1]})).reverse();
    const shown=S.histOpen?rows:rows.slice(0,5);
    h+='<div class="sec-h"><h3>היסטוריית עדכונים</h3><span class="muted small">'+hist.length+' נקודות בגרף</span></div><div class="surface list">'+
      shown.map(({p,prev})=>{
        const d=prev?r2(p.n-prev.n):null;
        return '<div class="hist-row"><div class="hd"><div>'+esc(p.note||'עדכון')+'</div><div class="small muted">'+esc(F.dt.format(new Date(p.t)))+
          (d!==null?', <span class="'+(d>=0?'pos':'neg')+'">'+money(d,{sign:true})+'</span>':'')+'</div></div><b>'+money(p.n)+'</b>'+
          '<button class="del-x" data-a="hist-del" data-id="'+p.t+'" aria-label="מחיקת הנקודה מהגרף">'+ICON.x+'</button></div>';
      }).join('')+
      (rows.length>5?'<button class="add-row" data-a="hist-toggle">'+(S.histOpen?'הצגת פחות':'הצגת כל '+rows.length+' הנקודות')+'</button>':'')+'</div>';
  }
  return h;
}

/* הגדרות ← תנועות חוזרות ותשלומים */
function recStatus(r){
  if(recDone(r))return 'הסתיים';
  const nx=dayIn(recNext(r),r.day),parts=[];
  if(r.count)parts.push('תשלום '+Math.min(r.count,recIndex(r,recNext(r))-1)+'/'+r.count+', נשארו '+money(recRemaining(r)));
  else parts.push('כל חודש ב־'+r.day);
  if(r.paused)parts.push('מושהה');else parts.push('הבא: '+esc(dayShort(nx)));
  const acct=r.type==='transfer'?'':r.accountId?acctName(r.accountId):'';
  if(acct)parts.push(esc(acct));   // מחזירה HTML (הסכום כולל תגיות), ולכן הטקסט עובר esc כאן
  return parts.join(' · ');
}
function recRow(r){
  const c=r.type==='transfer'?{icon:'⇄',color:'#7C8580'}:catView(r.categoryId);
  const amt=r.type==='income'?money(r.count?r.total:r.amount):r.type==='transfer'?money(r.amount):money(-(r.count?r.total:r.amount),{sign:true});
  return '<button class="tx-row'+(r.paused||recDone(r)?' dim':'')+'" data-a="rec-edit" data-id="'+esc(r.id)+'"><span class="ic" style="--c:'+c.color+'">'+esc(c.icon)+'</span>'+
    '<span class="tx-main"><span class="tx-title">'+esc(recLabel(r))+'</span><span class="tx-sub">'+recStatus(r)+'</span></span>'+
    '<span class="tx-amt '+(r.type==='income'?'pos':r.type==='transfer'?'xfer':'')+'">'+amt+'</span></button>';
}
function recSection(){
  const act=S.rec.filter(r=>!r.paused&&!recDone(r));
  const mon=t=>r2(act.filter(r=>r.type===t).reduce((s,r)=>s+r.amount,0));
  const exp=mon('expense'),inc=mon('income'),com=committedInst();
  const list=S.rec.slice().sort((a,b)=>(recDone(a)-recDone(b))||(a.paused-b.paused)||(a.day-b.day));
  let h='';   // הכותרת היא כותרת הדף (render)
  if(!list.length)return h+'<div class="surface empty">שכירות, משכורת, מנויים או קנייה בתשלומים. מוסיפים מחלון ההוספה: "כל חודש" או "בתשלומים".</div>';
  h+='<div class="surface list">'+
    ((exp||inc||com)?'<p class="muted small" style="padding:10px 2px 4px">'+[exp?'הוצאות קבועות בחודש: <b>'+money(exp)+'</b>':'',inc?'הכנסות קבועות: <b>'+money(inc)+'</b>':'',com?'נשאר לשלם בתשלומים: <b>'+money(com)+'</b>':''].filter(Boolean).join(' · ')+'</p>':'')+
    list.map(recRow).join('')+'</div>';
  return h;
}

      :'<label class="amount-wrap"><span class="cur">₪</span><input id="r-amount" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="'+r.amount+'" aria-label="סכום"></label>')+
    '<div class="field-label">תיאור</div><input id="r-note" class="input" enterkeyhint="done" autocomplete="off" placeholder="למשל: שכירות" value="'+esc(r.note)+'">'+
    (inst?'':'<div class="field-label">יום בחודש</div><input id="r-day" class="input" inputmode="numeric" autocomplete="off" style="width:90px;text-align:center" value="'+r.day+'">')+

    '<button class="btn primary grow" data-a="rec-save" data-primary>שמירה</button></div>');
  if(r.type!=='transfer')renderAcctChips();
}
function saveRec(){
  const f=S.form;if(!f||f.kind!=='rec')return;
  const r=S.rec.find(x=>x.id===f.id);if(!r)return;
  const prev=Object.assign({},r),upd={note:$('#r-note').value.trim()};
  if($('#r-amount')){const a=parseAmount($('#r-amount').value);if(!(a>0)){toast('צריך סכום גדול מאפס');focusEl($('#r-amount'));return;}upd.amount=a;}
  if($('#r-day')){const d=parseInt($('#r-day').value,10);if(!(d>=1&&d<=31)){toast('יום בחודש: 1 עד 31');focusEl($('#r-day'),true);return;}upd.day=d;}
  if(r.type!=='transfer')upd.accountId=f.accountId&&acctOf(f.accountId)?f.accountId:null;
  Object.assign(r,upd);if(!r.accountId)delete r.accountId;
  D.updRec(r.id,Object.assign({},upd,upd.accountId===null?{accountId:D.F.deleteField()}:{}));
  closeSheet();render();
  toast('נשמר','',()=>{
    Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,prev);

function scrollToOn(box){
  const on=box&&box.querySelector('.chip.on');if(!on||!box.getBoundingClientRect)return;
  requestAnimationFrame(()=>{
    const b=box.getBoundingClientRect(),c=on.getBoundingClientRect(),pad=18;
    if(!b.width)return;
    if(c.left<b.left+pad)box.scrollLeft+=c.left-b.left-pad;
    else if(c.right>b.right-pad)box.scrollLeft+=c.right-b.right+pad;
  });
}

function saveTx(){
  const f=S.form;if(!f)return;
  const amount=parseAmount($('#f-amount').value);
  if(!(amount>0)){toast('צריך סכום גדול מאפס');focusEl($('#f-amount'));return;}
  const xfer=f.type==='transfer';
  if(xfer){
    if(!f.fromId||!f.toId){toast('צריך לבחור מאיזה חשבון ולאיזה');return;}
    if(f.fromId===f.toId){toast('צריך שני חשבונות שונים');return;}
  }else if(!f.categoryId){toast('צריך לבחור קטגוריה');return;}
  const date=/^\d{4}-\d{2}-\d{2}$/.test($('#f-date').value)?$('#f-date').value:todayStr();
  const note=$('#f-note').value.trim();
  const mk=date.slice(0,7),active=wantedMonths().has(mk);
  const fields=xfer
    ?{type:'transfer',amount,categoryId:null,catName:'',date,note,fromId:f.fromId,toId:f.toId}
    :Object.assign({type:f.type,amount,categoryId:f.categoryId,catName:catView(f.categoryId).name,date,note},f.accountId&&acctOf(f.accountId)?{accountId:f.accountId}:{});
  if(!f.id&&f.repeat==='inst'){const n=parseInt($('#f-inst').value,10);if(!(n>=2&&n<=60)){toast('מספר תשלומים: 2 עד 60');focusEl($('#f-inst'),true);return;}}
  let prev=null,t;
  if(!f.id&&f.repeat!=='once'){/* נוצר בתוך saveRecurringNew */}
  else if(f.id){
    const i=S.tx.transactions.findIndex(x=>x.id===f.id);if(i<0)return;
    prev=Object.assign({},S.tx.transactions[i]);
    // שומרים את הקישור לתבנית (תנועה חוזרת / תשלום i מתוך n)
    t=Object.assign({id:prev.id,createdAt:prev.createdAt},fields,prev.recId?{recId:prev.recId}:{},prev.inst?{inst:prev.inst}:{});
    S.tx.transactions[i]=t;
  }else{
    t=Object.assign({id:uid(),createdAt:Date.now()},fields);
    if(active)S.tx.transactions.push(t);
  }
  if(!xfer)setLastAcct(f.type,f.accountId);
  if(!xfer&&!f.id)bumpCatUse(f.categoryId);
  if(!f.id&&f.repeat!=='once'){saveRecurringNew(f,fields,date);return;}
  const edited=!!f.id,tid=t.id;
  saveTxFx(t,prev);closeSheet();render();
  const undo=edited
    ?()=>{   // מחזירים את הגרסה הקודמת (גם את היתרות)
      const i=S.tx.transactions.findIndex(x=>x.id===tid),cur=i>=0?S.tx.transactions[i]:t;
      if(i>=0)S.tx.transactions[i]=Object.assign({},prev);else if(wantedMonths().has(prev.date.slice(0,7)))S.tx.transactions.push(Object.assign({},prev));
      saveTxFx(Object.assign({},prev),cur);render();toast('השינויים בוטלו');
    }
    :()=>{   // ההוספה בוטלה: מוחקים את התנועה ומחזירים את היתרות
      S.tx.transactions=S.tx.transactions.filter(x=>x.id!==tid);
      delTxFx(t);render();toast('ההוספה בוטלה');
    };
  toast(!active?'נשמר ב'+monthName(mk):edited?'השינויים נשמרו':xfer?'ההעברה נשמרה':(f.type==='income'?'ההכנסה נשמרה':'ההוצאה נשמרה'),'',undo);
}

/* תבנית חדשה (כל חודש / תשלומים). כל החודשים שהיום שלהם כבר הגיע נוצרים מיד, באותה שמירה
   (תבנית חדשה עוד לא מוכרת למכשיר אחר, ולכן אין סכנת כפילות, וזה עובד גם בלי חיבור) */
function saveRecurringNew(f,fields,date){
  const mk=date.slice(0,7),inst=f.repeat==='inst',n=inst?parseInt($('#f-inst').value,10):0,cur=monthKey(new Date());
  const {date:_d,...base}=fields;
  const r=Object.assign({id:uid()},base,{day:+date.slice(8),startMonth:mk,lastMonth:null,paused:false,createdAt:Date.now()},
    inst?{count:n,total:fields.amount}:{});
  if(inst)r.amount=instAmount(r,2);
  if(inst)r.paid=0;
  const months=recDue(r),txs=months.map(m=>{const t=recTx(r,m);if(inst)r.paid=r2(r.paid+t.amount);return t;});
  if(months.length)r.lastMonth=months[months.length-1];
  const fx=mergeFx([].concat(...txs.map(txEffects)));
  S.rec.push(r);
  txs.forEach(t=>{if(wantedMonths().has(t.date.slice(0,7)))S.tx.transactions.push(t);});
  applyFxLocal(fx);D.putRec(r,txs,fx);closeSheet();render();
  // איפה זה נמצא: אחרת תשלום שהתחיל בחודש קודם "נעלם" מהמסך
  const what=inst?'הראשון':'הראשונה';
  let where='';
  if(!txs.length)where=', '+what+' ב־'+dayShort(date);
  else if(mk!==cur)where=', '+what+' ב'+monthName(mk)+(txs.length>1?' (נוצרו '+txs.length+')':'');
  toast((inst?'נשמר ב־'+n+' תשלומים':'נשמרה כתנועה חוזרת')+where,'',()=>{
    S.rec=S.rec.filter(x=>x.id!==r.id);
    const ids=new Set(txs.map(t=>t.id));S.tx.transactions=S.tx.transactions.filter(x=>!ids.has(x.id));
    const back=negFx(fx);applyFxLocal(back);D.undoRec(r.id,txs,back);render();toast('בוטל');
  });
}

/* רשומת עדכון/התאמה לכל שינוי ידני בערך של חשבון (תשתית ליתרה היסטורית ולתשואה) */
function adjustRec(item,oldValue,isNew,now){
  const delta=r2(item.value-oldValue);
  if(!delta)return null;
  const kind=S.nw.assets.includes(item)?'asset':'liab',live=acctGroup(kind,item.category)==='live';
  return{id:uid(),type:'adjust',amount:Math.abs(delta),categoryId:null,catName:'',date:todayStr(),
    note:isNew?'יתרת פתיחה':live?'התאמת יתרה':'עדכון שווי',createdAt:now,accountId:item.id,delta,value:item.value};
}
function saveNw(){
  const f=S.form;if(!f)return;
  const list=f.nk==='asset'?S.nw.assets:S.nw.liabilities,cats=f.nk==='asset'?ASSET_CATS:LIAB_CATS;
  const raw=$('#n-value').value,live=acctGroup(f.nk,f.category)==='live';
  // סכום שלא נגעו בו נשאר הערך הנוכחי (גם אם השתנה בינתיים במכשיר אחר)
  const cur0=f.id?list.find(i=>i.id===f.id):null;
  const value=cur0&&raw.trim()===$('#n-value').dataset.orig?cur0.value:parseSigned(raw,live&&f.nk==='asset');
  if(!raw.trim()||!(Math.abs(value)>=0)){toast('צריך סכום תקין');focusEl($('#n-value'));return;}
  const name=$('#n-name').value.trim()||cats.find(c=>c.id===f.category).name;
  const now=Date.now();
  let item,prev=null;
  if(f.id){
    item=list.find(i=>i.id===f.id);if(!item)return;
    prev=Object.assign({},item);
    Object.assign(item,{name,category:f.category,value,updatedAt:now});
  }else{
    item={id:uid(),name,category:f.category,value,updatedAt:now};
    list.push(item);
  }
  const pt=snapshot((f.id?'עדכון: ':'הוספה: ')+name);
  const edited=!!f.id,nk=f.nk;
  const rec=adjustRec(item,prev?prev.value:0,!prev,now);
  if(rec)S.tx.transactions.push(rec);
  const delta=prev?r2(item.value-prev.value):undefined;
  D.putItem(nk,item,pt,rec,delta);closeSheet();render();
  const iid=item.id;
  toast(edited?(pt?'העדכון נשמר ונוסף לגרף':'העדכון נשמר'):(nk==='asset'?'הנכס נוסף':'ההתחייבות נוספה'),'',()=>{
    const lst=nk==='asset'?S.nw.assets:S.nw.liabilities,cur=lst.find(i=>i.id===iid);
    if(prev){if(cur)Object.assign(cur,prev);else lst.push(Object.assign({},prev));}
    else{const i=lst.indexOf(cur);if(i>=0)lst.splice(i,1);}
    if(pt)S.nw.history=S.nw.history.filter(p=>p.t!==pt.t);
    if(rec)S.tx.transactions=S.tx.transactions.filter(t=>t.id!==rec.id);
    D.revertItem(nk,iid,prev,pt&&pt.t,rec&&rec.id,delta);render();toast(prev?'העדכון בוטל':'ההוספה בוטלה');
  });
}

function bulkRow(kind,x,c){
  const neg=kind==='asset'&&acctGroup(kind,x.category)==='live';   // עו"ש ומזומן יכולים להיות במינוס
  return '<label class="bulk-row"><span class="ic sm" style="--c:'+c.color+'">'+c.icon+'</span><span class="bulk-name">'+esc(x.name)+'</span>'+

    '<input class="bulk-in" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-kind="'+kind+'" data-id="'+esc(x.id)+'" value="'+x.value+'" data-orig="'+x.value+'" aria-label="'+esc(x.name)+'"></label>';
}
function bulkRows(kind,list,cats){
  let h='';
  for(const c of cats){
    list.filter(x=>x.category===c.id).sort((a,b)=>b.value-a.value).forEach(x=>{h+=bulkRow(kind,x,c);});
  }
  return h;
}
function bulkTotal(){
  const el=$('#b-total');if(!el)return;
  let a=0,l=0;
  $$('#sheet .bulk-in').forEach(inp=>{
    const kind=inp.dataset.kind,list=kind==='asset'?S.nw.assets:S.nw.liabilities,x=list.find(i=>i.id===inp.dataset.id);
    let v=x?x.value:0;
    const raw=inp.value.trim();
    if(raw!==''){const p=parseSigned(raw,kind==='asset'&&!!x&&acctGroup(kind,x.category)==='live');if(isFinite(p))v=p;}
    if(kind==='asset')a+=v;else l+=v;
  });
  el.innerHTML=money(r2(a-l));
}
function openBulkSheet(){
  if(!S.nw.assets.length&&!S.nw.liabilities.length){toast('אין עדיין נכסים לעדכון');return;}
  S.form={kind:'bulk'};
  let h=sheetHead('עדכון מלא')+
    '<p class="hint" style="margin-top:0">עוברים על הסכומים ומעדכנים מה שהשתנה. השמירה מסמנת את כל הפריטים כמעודכנים ומוסיפה נקודה אחת לגרף.</p>';
  if(S.nw.assets.length)h+='<div class="field-label">נכסים</div>'+bulkRows('asset',S.nw.assets,ASSET_CATS);
  if(S.nw.liabilities.length)h+='<div class="field-label">התחייבויות</div>'+bulkRows('liab',S.nw.liabilities,LIAB_CATS);
  h+='<div class="bulk-total"><span>שווי נקי</span><b id="b-total"></b></div>'+
    '<div class="sheet-actions"><button class="btn primary grow" data-a="bulk-save" data-primary>שמירת עדכון</button></div>';
  openSheet(h);
  bulkTotal();
}
function saveBulk(){
  const f=S.form;if(!f||f.kind!=='bulk')return;
  const now=Date.now(),changes=[];
  for(const el of $$('#sheet .bulk-in')){
    const raw=el.value.trim(),kind=el.dataset.kind;
    const list=kind==='asset'?S.nw.assets:S.nw.liabilities;
    const x=list.find(i=>i.id===el.dataset.id);if(!x)continue;
    let v=x.value;
    if(raw!==''&&raw!==el.dataset.orig){   // שדה שלא נגעו בו לא משנה את הערך (גם אם הוא השתנה בינתיים במכשיר אחר)
      v=parseSigned(raw,kind==='asset'&&acctGroup(kind,x.category)==='live');   // עו"ש או מזומן יכולים להיות במינוס
      if(!isFinite(v)){toast('סכום לא תקין ב"'+x.name+'"','err');focusEl(el,true);return;}
    }
    changes.push({kind,x,v});
  }
  if(!changes.length){closeSheet();return;}
  const olds=changes.map(({kind,x,v})=>({kind,id:x.id,value:x.value,updatedAt:x.updatedAt,d:r2(v-x.value)}));
  const recs=[];
  const ups=changes.map(({kind,x,v})=>{const old=x.value;x.value=v;x.updatedAt=now;const r=adjustRec(x,old,false,now);if(r)recs.push(r);return{kind,id:x.id,d:r2(v-old),updatedAt:now};});
  recs.forEach(r=>S.tx.transactions.push(r));
  const pt=snapshot('עדכון מלא');
  D.bulk(ups,pt,recs);closeSheet();render();
  toast(pt?'העדכון נשמר ונוסף לגרף':'העדכון נשמר','',()=>{
    for(const o of olds){const x=(o.kind==='asset'?S.nw.assets:S.nw.liabilities).find(i=>i.id===o.id);if(x){x.value=o.value;x.updatedAt=o.updatedAt;}}
    if(pt)S.nw.history=S.nw.history.filter(p=>p.t!==pt.t);
    const rids=new Set(recs.map(r=>r.id));S.tx.transactions=S.tx.transactions.filter(t=>!rids.has(t.id));
    D.bulkRevert(olds,pt&&pt.t,[...rids]);render();toast('העדכון המלא בוטל');
  });
}

/* ================= backup ================= */
/* ייצוא בשני שלבים: קודם מכינים את הקובץ (קריאה מהשרת), ואז המשתמש לוחץ "שמירת הקובץ".
   באייפון חלון השיתוף נפתח רק ישירות מלחיצה, ולא אחרי המתנה לשרת. */
async function doExport(){
  if(navigator.onLine===false){toast('הגיבוי דורש חיבור לאינטרנט','err');return;}
  toast('מכין גיבוי…','busy');

/* ================= ייבוא חכם =================
   מוסיף רק מה שחסר. לא מוחק ולא דורס: כשפריט קיים גם בחשבון וגם בגיבוי, הגרסה שבחשבון נשמרת.
   "קיים" = אותו מזהה, ואם אין מזהה תואם, אותו תוכן (שם/תאריך/סכום/הערה). */
const nkey=v=>String(v==null?'':v).trim().replace(/\s+/g,' ').toLowerCase();
const txKey=t=>t.type+'|'+t.date+'|'+r2(+t.amount)+'|'+nkey(t.note);
const histDay=t=>{const d=new Date(+t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function planImport(bTx,bNw,cur,bRec){
  const add={categories:[],transactions:[],assets:[],liabilities:[],history:[],recurring:[]};
  const st={catsLinked:0,txSkip:0,itemsSkip:0,histSkip:0,recSkip:0};
  // קטגוריות: לפי מזהה, אחר כך לפי סוג+שם
  const catIds=new Set(cur.cats.map(c=>c.id)),catByKey=new Map(cur.cats.map(c=>[c.type+'|'+nkey(c.name),c])),catMap=new Map();
  for(const c of bTx.categories){
    if(catIds.has(c.id)){catMap.set(c.id,c.id);st.catsLinked++;continue;}
    const k=c.type+'|'+nkey(c.name),hit=catByKey.get(k);
    if(hit){catMap.set(c.id,hit.id);st.catsLinked++;continue;}
    add.categories.push(c);catIds.add(c.id);catByKey.set(k,c);catMap.set(c.id,c.id);
  }
  const catById=new Map([...cur.cats,...add.categories].map(c=>[c.id,c]));
  // תנועות: לפי מזהה, אחר כך לפי תוכן, כולל ספירה (שתי תנועות זהות בגיבוי מול אחת בחשבון = מוסיפים אחת)
  const txIds=new Set(cur.tx.map(t=>t.id)),cnt=new Map();
  cur.tx.forEach(t=>{const k=txKey(t);cnt.set(k,(cnt.get(k)||0)+1);});
  for(const t of bTx.transactions){
    if(txIds.has(t.id)){st.txSkip++;continue;}
    const k=txKey(t),n=cnt.get(k)||0;
    if(n>0){cnt.set(k,n-1);st.txSkip++;continue;}
    const cid=t.categoryId&&catMap.has(t.categoryId)?catMap.get(t.categoryId):null;
    const c=cid?catById.get(cid):null;
    add.transactions.push(Object.assign({},t,{categoryId:cid,catName:c?c.name:t.catName}));
    txIds.add(t.id);
  }
  // נכסים והתחייבויות: לפי מזהה, אחר כך לפי קטגוריה+שם
  const items=(list,existing,out)=>{
    const ids=new Set(existing.map(x=>x.id)),keys=new Set(existing.map(x=>x.category+'|'+nkey(x.name)));
    for(const x of list){
      const k=x.category+'|'+nkey(x.name);
      if(ids.has(x.id)||keys.has(k)){st.itemsSkip++;continue;}
      out.push(x);ids.add(x.id);keys.add(k);
    }
  };
  items(bNw.assets,cur.assets,add.assets);items(bNw.liabilities,cur.liabs,add.liabilities);
  // נקודות בגרף: אותו רגע, או אותו יום עם אותם סכומים
  const ts=new Set(cur.hist.map(p=>p.t)),dk=new Set(cur.hist.map(p=>histDay(p.t)+'|'+r2(p.a)+'|'+r2(p.l)));
  for(const p of bNw.history){
    const k=histDay(p.t)+'|'+r2(p.a)+'|'+r2(p.l);
    if(ts.has(p.t)||dk.has(k)){st.histSkip++;continue;}
    add.history.push(p);ts.add(p.t);dk.add(k);
  }
  // תבניות חוזרות: לפי מזהה, אחר כך לפי סוג+סכום+יום+תיאור
  const recKey=r=>r.type+'|'+r2(r.count?r.total:r.amount)+'|'+r.day+'|'+nkey(r.note);
  const rIds=new Set((cur.rec||[]).map(r=>r.id)),rKeys=new Set((cur.rec||[]).map(recKey));
  for(const r of (bRec||[])){
    if(rIds.has(r.id)||rKeys.has(recKey(r))){st.recSkip++;continue;}
    const cid=r.categoryId&&catMap.has(r.categoryId)?catMap.get(r.categoryId):null;
    add.recurring.push(Object.assign({},r,{categoryId:cid}));rIds.add(r.id);rKeys.add(recKey(r));
  }
  const total=add.categories.length+add.transactions.length+add.assets.length+add.liabilities.length+add.history.length+add.recurring.length;
  return{add,st,total};
}
function isPristine(cur){
  if(cur.tx.length||cur.assets.length||cur.liabs.length||cur.hist.length||(cur.rec||[]).length)return false;
  if(cur.cats.length!==DEFAULT_CATS.length)return false;
  const def=new Set(DEFAULT_CATS.map(([name,icon,type])=>type+'|'+nkey(name)));
  return cur.cats.every(c=>def.has(c.type+'|'+nkey(c.name)));
}
function importSummary(plan){
  const a=plan.add,st=plan.st,rows=[];
  const row=(label,addN,skipN)=>{if(addN||skipN)rows.push('<div class="row between" style="padding:7px 2px;border-bottom:1px solid var(--line)"><span>'+label+'</span><span class="num small"><b>'+F.n0.format(addN)+'</b> חדשים'+(skipN?' · <span class="muted">'+F.n0.format(skipN)+' קיימים</span>':'')+'</span></div>');};
  row('תנועות',a.transactions.length,st.txSkip);
  row('קטגוריות',a.categories.length,st.catsLinked);
  row('נכסים והתחייבויות',a.assets.length+a.liabilities.length,st.itemsSkip);
  row('נקודות בגרף',a.history.length,st.histSkip);
  row('תנועות חוזרות',a.recurring.length,st.recSkip);
  return rows.join('');
}
async function runImport(plan){
  toast('מייבא…','busy');
  try{
    const a=plan.add;
    await D.importAll({categories:a.categories,transactions:a.transactions},{assets:a.assets,liabilities:a.liabilities,history:a.history},a.recurring);
    toast('נוספו '+F.n0.format(plan.total)+' פריטים מהגיבוי');
  }catch(e){console.error(e);toast('הייבוא לא הושלם. אפשר לייבא שוב, מה שכבר נוסף ידולג'+errTag(e),'err');}
}
async function importFile(file){
  let obj;
  try{obj=JSON.parse(await file.text());}catch(e){toast('הקובץ אינו גיבוי תקין','err');return;}
  if(!obj||typeof obj!=='object'||!obj.tx||!obj.nw){toast('הקובץ אינו גיבוי של הדשבורד','err');return;}
  const bTx=normTx(obj.tx),bNw=normNw(obj.nw);
  toast('בודק מה כבר קיים…','busy');
  let curTx;
  try{
    curTx=await withRetry(()=>D.allTx(),'החיבור איטי, מנסה שוב…');
  }catch(e){console.error(e);toast('הייבוא דורש חיבור לאינטרנט'+errTag(e),'err');return;}
  const cur={cats:S.tx.categories,tx:curTx,assets:S.nw.assets,liabs:S.nw.liabilities,hist:S.nw.history,rec:S.rec};
  const plan=planImport(bTx,bNw,cur,normRec(obj.rec));
  if(!plan.total){toast('כל מה שבגיבוי כבר קיים בחשבון');return;}
  // חשבון ריק (רק קטגוריות ברירת המחדל): אין מה לדרוס, מייבאים מיד
  if(isPristine(cur)){await runImport(plan);return;}
  S.form={kind:'import',plan};
  openSheet(sheetHead('ייבוא מגיבוי')+
    '<div class="banner" style="margin:4px 0 12px">בחשבון כבר יש נתונים. יתווסף רק מה שחסר, ושום דבר קיים לא ישתנה. תנועה ששינית אחרי שמירת הגיבוי עלולה להתווסף שוב.</div>'+
    importSummary(plan)+
    '<div class="sheet-actions"><button class="btn ghost" data-a="sheet-close">ביטול</button><button class="btn primary grow" data-a="import-go" data-primary>הוספת '+F.n0.format(plan.total)+' פריטים</button></div>');
}

      toast('מנקה…','busy');
      try{const n=await D.betaWipe();toast('נוקו '+n+' מסמכים מסביבת הבדיקה');}
      catch(err){console.error(err);toast('הניקוי נכשל. בדקו את החיבור ונסו שוב'+errTag(err),'err');}
      break;
    }
    case 'signout':{
      closeSheet();
      if(!await askConfirm('לצאת מהחשבון?',{ok:'יציאה'}))break;
      try{D.stop();await D.signOut();}catch(err){console.error(err);toast('היציאה נכשלה','err');}
      break;
    }
    case 'reset':{
      if(!await askConfirm('למחוק לצמיתות את כל התנועות, הקטגוריות, הנכסים וההיסטוריה? כדאי לייצא גיבוי קודם.',{ok:'מחיקת הכל',danger:true}))break;
      toast('מוחק…','busy');
      let txIds;
      try{txIds=await withRetry(()=>D.txIds(),'החיבור איטי, מנסה שוב…');}catch(err){console.error(err);toast('המחיקה דורשת חיבור לאינטרנט'+errTag(err),'err');break;}
      const old={cats:S.tx.categories.map(c=>c.id),txs:txIds,assets:S.nw.assets.map(x=>x.id),
        liabs:S.nw.liabilities.map(x=>x.id),hist:S.nw.history.map(p=>String(p.t)),recs:S.rec.map(r=>r.id)};
      const cats=defaultCats();
      S.tx={categories:cats,transactions:[]};S.nw={assets:[],liabilities:[],history:[]};S.rec=[];
      S.txCat=null;
      D.wipe(old,cats);render();toast('כל הנתונים נמחקו');break;
    }
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='n-value'){const nb=$('#n-neg');if(nb)nb.classList.toggle('on',/^\s*[-−]/.test(el.value));}
  if(el.id==='f-amount'||el.id==='n-value')sizeAmount(el);
  if(el.id==='f-amount'||el.id==='f-inst')syncRep();
  if(el.classList&&el.classList.contains('bulk-in'))bulkTotal();
  if(el.id==='tx-search'){S.txQ=el.value;updateTxResults();}
});
document.addEventListener('focusin',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('bulk-in'))setTimeout(()=>{try{el.select();}catch(err){}},0);
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-date'&&S.form){S.form.date=e.target.value;syncDateChips();syncRep();}
  if(e.target.id==='file'){const fl=e.target.files&&e.target.files[0];e.target.value='';if(fl)importFile(fl);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#dialog').classList.contains('open'))return;if($('#sheet').classList.contains('open'))closeSheet();return;}
  if(e.key==='Enter'&&e.target.id==='tx-search'){e.preventDefault();e.target.blur();return;}
  if(e.key==='Enter'&&e.target.matches('#sheet input:not([type=date])')){
    e.preventDefault();
    if(e.target.id==='f-newcat-name'){addInlineCat();return;}
    if(e.target.classList.contains('bulk-in')){
      const all=$$('#sheet .bulk-in'),i=all.indexOf(e.target);
      if(i>=0&&i<all.length-1)focusEl(all[i+1],true);else e.target.blur();
      return;
    }
    const p=$('#sheet [data-primary]');if(p)p.click();
  }
});
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitSheet);window.visualViewport.addEventListener('scroll',fitSheet);}
let rz;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.ready){const pts=rangePoints();$$('#view [data-chart]').forEach(el=>drawChart(el,pts));}},150);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;checkNewVersion();if(SYNC.n>0&&D.reconnect)D.reconnect();if(S.ready){render();genRecurring();}});
window.addEventListener('online',()=>{syncUpdate();if(SYNC.n>0&&D.reconnect)D.reconnect();if(S.ready){render();genRecurring();}});
window.addEventListener('offline',()=>{syncUpdate();if(S.ready)render();});
// החלקה אחורה באייפון (או כפתור "אחורה"): חוזרת מדף של ההגדרות לתפריט
window.addEventListener('popstate',e=>{
  const v=e.state&&e.state.set||null;
  if(S.view!=='settings'||S.setPage===v)return;
  S.setPage=v;if(S.ready){render();window.scrollTo(0,0);}
});

/* גרסה חדשה ירדה ברקע? ה-service worker שומר את מזהה הגרסה של הדף האחרון שהוריד (sw.js: META), ואנחנו משווים לשלנו */
function checkNewVersion(){
  if(S.newVer||typeof caches==='undefined')return;
  caches.open('finance-meta-'+ENV).then(c=>c.match('new-version')).then(r=>r?r.text():'').then(v=>{
    if(v&&v!==VERSION_LABEL&&!S.newVer){S.newVer=true;if(S.ready)render();}
  }).catch(()=>{});
}

/* ================= boot ================= */
function wantsQuickAdd(){
  const hit=s=>/(?:^|[?&#])quickadd(?:=(?:1|true|yes))?(?:$|[&#])/i.test(s||'');
  try{if(hit(location.search)||hit(location.hash))return true;}catch(e){}
  try{if(document.referrer){const u=new URL(document.referrer);if(hit(u.search)||hit(u.hash))return true;}}catch(e){}
  return false;
}
(async function init(){
  if(ENV==='beta'){
    document.body.classList.add('beta');
    document.body.insertAdjacentHTML('afterbegin','<div class="beta-bar" role="note">סביבת בדיקה · גרסה '+VERSION_LABEL+' · הנתונים נפרדים מהאמיתיים</div>');
    document.title='בדיקה · הכסף שלי';
    const mt=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(mt)mt.setAttribute('content','בדיקה');
  }
  S.quick=wantsQuickAdd();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    // האפליקציה נפתחת מהעותק השמור, והגרסה החדשה יורדת ברקע. כשהיא שונה, מציעים רענון
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='new-version')checkNewVersion();});
    setTimeout(checkNewVersion,4000);
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  try{await D.init();mark('lib');}
  catch(e){
    console.error(e);
    $('#view').innerHTML='<div class="surface empty">לא ניתן לטעון את האפליקציה. בדקו את החיבור לאינטרנט ורעננו.</div>';
    return;
  }
  const snap=loadSnap();
  if(snap)enterEarly(snap);
  D.onAuth(user=>{
    mark('auth');
    let lost=false;
    if(S.early){
      S.early=false;
      // אותו משתמש כמו בתמונה השמורה: המאזינים כבר רצים, ממשיכים בלי להתחיל מחדש
      if(user&&user.uid===snap.uid&&user.emailVerified&&!S.noAccess){S.user=user;return;}
      lost=S.earlyWrites>0;closeSheet();
    }
    D.stop();
    if(!user){
      S.user=null;S.ready=false;S.live=false;S.noAccess=false;clearSnap();showAuth('in');
      if(lost)gateSay('ההתחברות פגה, וצריך להיכנס מחדש. מה שנוסף בשניות האחרונות לא נשמר.');
      return;
    }
    S.user=user;
    if(!user.emailVerified){showVerify(user);return;}
    enter(user);
  });
})();
})();
</script>
