<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1316" media="(prefers-color-scheme: dark)">
<script>
/* מוחל לפני הציור הראשון, כדי שלא יהיה הבהוב בצבע הלא נכון */
(function(){var t=null;try{t=localStorage.getItem("fin-theme");}catch(e){}
if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);
var c=t==="dark"?"#0D1316":"#F2F4F1";document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",c);});}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>הכסף שלי</title>
<style>
:root{
  --paper:#F2F4F1;--surface:#FFFFFF;--sunk:#E6EBE7;
  --ink:#16211D;--ink-2:#5B6863;--ink-3:#95A09B;--line:#DCE2DD;
  --navy:#172A4A;--on-navy:#EEF3F8;--on-navy-2:#9FB0C9;--mint:#7EE0B5;--navy-line:rgba(238,243,248,.11);
  --income:#127A63;--expense:#C83E52;--warn:#A86B12;
  --accent:#172A4A;--accent-ink:#FFFFFF;
  --chart-line:#127A63;--chart-grid:var(--line);--chart-text:var(--ink-3);--card-bg:var(--surface);--tip-bg:var(--ink);--tip-ink:var(--surface);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
/* מראה: אוטומטי לפי הטלפון, או בחירה ידנית (data-theme על <html>, נשמר בכל מכשיר בנפרד) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1316;--surface:#151E23;--sunk:#1E2A30;
  --ink:#E8EEEB;--ink-2:#9AA7A2;--ink-3:#63716C;--line:#243138;
  --navy:#1A3156;--mint:#86E6BC;
  --income:#4CC79F;--expense:#F2798A;--warn:#E0A84A;
  --accent:#9DBDF5;--accent-ink:#0D1316;
  --chart-line:#4CC79F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1316;--surface:#151E23;--sunk:#1E2A30;
  --ink:#E8EEEB;--ink-2:#9AA7A2;--ink-3:#63716C;--line:#243138;
  --navy:#1A3156;--mint:#86E6BC;
  --income:#4CC79F;--expense:#F2798A;--warn:#E0A84A;
  --accent:#9DBDF5;--accent-ink:#0D1316;
  --chart-line:#4CC79F;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Rubik,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.cs{font-size:.84em;font-weight:500;opacity:.75;margin-right:.06em}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.pos{color:var(--income)}.neg{color:var(--expense)}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(116px + var(--safe-b))}
.top{padding:0 2px 14px}
.top h1{font-size:28px;font-weight:780;letter-spacing:-.03em;line-height:1.1}
.top .sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}

.big{font-size:40px;font-weight:780;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.big .cs{font-size:.5em;vertical-align:.62em;opacity:.6;font-weight:600;margin-right:.1em}
h2.h{font-size:15px;font-weight:650;color:var(--ink-2)}
.link{color:var(--accent);font-weight:620;font-size:14px;padding:6px 2px}

/* cash flow */
.flow{display:block;width:100%;padding:6px 2px 20px;cursor:pointer}
.ledger{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.lg-row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;font-size:14px}
.lg-row .lg-name{color:var(--ink-2)}
.lg-bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.lg-bar i{display:block;height:100%;border-radius:5px;min-width:3px}
.lg-bar i.inc{background:var(--income)}.lg-bar i.exp{background:var(--expense)}
.lg-row b{font-weight:680;min-width:86px;text-align:left}
.hint{font-size:13px;color:var(--ink-2);margin-top:10px}

/* navy panel — the one bold element */
.panel{background:var(--navy);color:var(--on-navy);border-radius:26px;padding:20px 18px 16px;margin-bottom:8px;
  --chart-line:var(--mint);--chart-grid:var(--navy-line);--chart-text:var(--on-navy-2);--card-bg:var(--navy);--tip-bg:var(--on-navy);--tip-ink:var(--navy);--accent:var(--mint)}
.panel h2.h{color:var(--on-navy-2)}
.panel .muted{color:var(--on-navy-2)}
.delta{font-size:14px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.delta .up{color:var(--income);font-weight:650}.delta .down{color:var(--expense);font-weight:650}
.panel .delta .up{color:var(--mint)}.panel .delta .down{color:#FFA3AF}
.nw-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--navy-line)}
.nw-split div{display:flex;flex-direction:column;gap:1px}
.nw-split span{font-size:13px;color:var(--on-navy-2)}
.nw-split b{font-size:18px;font-weight:680}

/* chart */
.chart{position:relative;direction:ltr;margin:14px -2px 6px;touch-action:pan-y;-webkit-user-select:none;user-select:none;min-height:64px}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--chart-grid);stroke-width:1}
.chart .gt{fill:var(--chart-text);font-size:11px;font-family:inherit}
.chart .ln{fill:none;stroke:var(--chart-line);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dl{fill:var(--chart-line);stroke:var(--card-bg);stroke-width:3}
.chart .xl{stroke:var(--chart-text);stroke-width:1;stroke-dasharray:3 3}
.chart .xc{fill:var(--chart-line);stroke:var(--card-bg);stroke-width:3}
.tip{position:absolute;top:0;left:0;transform:translate(-50%,-100%);background:var(--tip-bg);color:var(--tip-ink);padding:6px 10px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;display:flex;flex-direction:column;align-items:center;line-height:1.3;direction:rtl}
.tip.on{opacity:1}
.tip b{font-size:14px}
.chart-empty{direction:rtl;text-align:center;padding:16px 8px 6px;font-size:14px;color:var(--chart-text)}
.chart-empty .btn{margin-top:12px}
.mini-seg{display:inline-flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px}
.mini-seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:620;color:var(--ink-2)}
.mini-seg button.on{background:var(--surface);color:var(--ink)}
.panel .mini-seg{background:rgba(238,243,248,.08)}
.panel .mini-seg button{color:var(--on-navy-2)}
.panel .mini-seg button.on{background:rgba(238,243,248,.16);color:var(--on-navy)}

/* surfaces & lists */
.surface{background:var(--surface);border-radius:18px;padding:16px}
.surface + .surface{margin-top:10px}
.list{padding:2px 14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}
.sec-h h3{font-size:18px;font-weight:720;letter-spacing:-.015em}
.tx-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;text-align:start;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:0}
.tx-row:active{opacity:.55}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--sunk);background:color-mix(in srgb,var(--c,#888) 17%,transparent)}
.ic.sm{width:30px;height:30px;border-radius:9px;font-size:15px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub.stale{color:var(--warn)}
.tx-amt{font-weight:660;font-size:15.5px}
.add-row{display:block;width:100%;padding:13px 0;color:var(--accent);font-weight:620;text-align:start}
.empty{text-align:center;color:var(--ink-2);padding:26px 12px;font-size:14.5px}
.empty .btn{margin-top:14px}

/* tx view */
.month-sw{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 6px}
.month-sw .mname{font-weight:720;font-size:19px;text-align:center;letter-spacing:-.01em}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--sunk)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 16px}
.tri div{display:flex;flex-direction:column;gap:1px;padding:0 12px;border-inline-start:1px solid var(--line)}
.tri div:first-child{border-inline-start:0;padding-inline-start:2px}
.tri span{font-size:13px;color:var(--ink-2)}
.tri b{font-size:18px;font-weight:700}
.filter-sum{font-size:13.5px;color:var(--ink-2);margin:4px 2px 0}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-weight:620;margin:18px 4px 7px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 8px;border-radius:10px;font-weight:620;color:var(--ink-2);text-align:center;font-size:15px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.exp{color:var(--expense)}.seg button.on.inc{color:var(--income)}
.seg.locked{opacity:.5;pointer-events:none}

.chips{display:flex;gap:8px}
.chips.wrap{flex-wrap:wrap}
.chips.scroll{overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.line{overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips.line::-webkit-scrollbar{display:none}
/* קטגוריות: גוש של כמה שורות שנגלל לצדדים */
.chips.block{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,1),auto);justify-content:start;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips.block::-webkit-scrollbar{display:none}
.tx-row.dim{opacity:.55}
.inst-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.inst-row .input{width:90px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14.5px;font-weight:560;white-space:nowrap;flex:none}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface))}
.chip.add{border-style:dashed;color:var(--accent)}

.bar-row{display:block;width:100%;padding:8px 0;text-align:start}
.bar-top{display:flex;align-items:center;gap:10px;font-size:14.5px}
.bar-top b{font-weight:660;min-width:74px;text-align:left}
.bar-top .pc{color:var(--ink-3);font-size:12.5px}
.track{display:block;height:6px;border-radius:3px;background:var(--sunk);margin:7px 40px 0 0;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}

/* net worth */
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 10px}
.stack i{display:block;height:100%;flex-basis:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.grp-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650;color:var(--ink-2);padding:14px 0 2px}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-row:last-child{border-bottom:0}
.hist-row .hd{flex:1;min-width:0}
.hist-row .hd div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del-x{width:34px;height:34px;border-radius:10px;color:var(--ink-3);display:grid;place-items:center;flex:none}
.del-x svg{width:18px;height:18px}

/* buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:660;font-size:16px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk)}
.btn.danger{color:var(--expense)}
.btn.danger.solid{background:var(--expense);color:#fff}
.btn.full{width:100%}
.btn.grow{flex:1}
.field-label{font-size:13px;font-weight:650;color:var(--ink-2);margin:16px 2px 8px}
.input{width:100%;padding:13px 14px;border-radius:14px;background:var(--sunk);border:1.5px solid transparent;font-size:16px;outline:0}
.input:focus{border-color:var(--accent)}
input[type=date].input{min-height:48px;-webkit-appearance:none;appearance:none}
textarea.input{min-height:130px;direction:ltr;text-align:left;resize:vertical;font-size:16px}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 0 4px;direction:ltr;cursor:text}
.amount-wrap .cur{font-size:26px;color:var(--ink-3);font-weight:600}
.amount-wrap input{font-size:46px;font-weight:780;letter-spacing:-.03em;border:0;background:transparent;outline:0;width:2ch;max-width:80%;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.amount-wrap input::placeholder{color:var(--ink-3)}
.amount-wrap.exp input{color:var(--expense)}.amount-wrap.inc input{color:var(--income)}
.date-row{display:flex;gap:8px;align-items:center}
.date-row .input{flex:1;min-width:0}
[hidden]{display:none!important}   /* אחרת display של מחלקה גובר על hidden */
.newcat{display:flex;gap:8px;margin-top:10px;align-items:center}
.emoji-in{width:58px!important;flex:none;text-align:center;font-size:20px;padding:10px 4px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
.emoji-pick button{width:42px;height:42px;border-radius:10px;font-size:21px;display:grid;place-items:center}
.emoji-pick button:active{background:var(--sunk)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:2px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c)}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
/* כפתורי הפעולה צמודים לתחתית החלון, כדי שהשמירה תמיד נראית (גם כשהתוכן ארוך וגם מעל המקלדת) */
.sheet .sheet-actions{position:sticky;bottom:calc(-18px - var(--safe-b));margin:14px -18px calc(-18px - var(--safe-b));padding:12px 18px calc(18px + var(--safe-b));background:var(--surface);border-top:1px solid var(--line);z-index:2}
.sheet.kb{padding-bottom:8px}
.sheet.kb .sheet-actions{bottom:-8px;margin:10px -18px -8px;padding:8px 18px}
.sheet.kb .sheet-actions .btn{padding:10px 16px;font-size:15px}
.neg-btn{width:38px;height:38px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:17px;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.neg-btn.on{background:color-mix(in srgb,var(--expense) 16%,var(--surface));color:var(--expense)}
.brk-mini{display:block;width:100%;text-align:start}
.brk-mini .stack{margin:0 0 10px}
.brk-mini .legend{margin:0}
.bk-panel{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.foot{font-size:12.5px;color:var(--ink-3);text-align:center;margin:20px 8px}
.banner{background:#FDF1D8;color:#6A4A06;border-radius:14px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.banner.err{background:#FBE3E6;color:#8E2233}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner{background:#3A2E12;color:#F1D48A}:root:not([data-theme="light"]) .banner.err{background:#3D1C22;color:#FFB3BE}}
:root[data-theme="dark"] .banner{background:#3A2E12;color:#F1D48A}:root[data-theme="dark"] .banner.err{background:#3D1C22;color:#FFB3BE}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(8px + var(--safe-b));background:var(--paper);background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:620;color:var(--ink-3);padding:6px 0 2px}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:2.3}
.fab{justify-self:center;width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-28px;box-shadow:0 10px 22px -8px rgba(23,42,74,.55),0 0 0 5px var(--paper)}
.fab svg{width:30px;height:30px;stroke-width:2.4}
.fab:active{transform:scale(.93)}

/* sheet, dialog, toast */
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:45}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px calc(18px + var(--safe-b));max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .chip{background:var(--surface)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h2{font-size:19px;font-weight:720}
.dialog{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,14,20,.45);z-index:80;opacity:0;pointer-events:none;padding:24px;transition:opacity .15s}
.dialog.open{opacity:1;pointer-events:auto}
.dlg{background:var(--surface);border-radius:20px;padding:20px;max-width:360px;width:100%}
.dlg p{font-size:16px;margin-bottom:18px;line-height:1.5}
.dlg .row{gap:10px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:620;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100vw - 32px);width:max-content;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.undo{display:flex;align-items:center;gap:4px;padding-block:4px;padding-inline:18px 6px}
.toast.undo.show{pointer-events:auto}
.toast-undo{color:inherit;font:inherit;font-weight:760;background:none;border:0;padding:10px 14px;margin:-4px 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.save-rate{font-size:15px;color:var(--ink);margin-top:10px}
.save-rate b{font-weight:760}
.tx-save-rate{font-size:13.5px;color:var(--ink-2);margin:-8px 2px 14px}
.tx-save-rate b{color:var(--ink);font-weight:700}
.search{position:relative;margin:0 0 12px}
.search .input{padding-inline-end:44px;-webkit-appearance:none;appearance:none}
.search .input::-webkit-search-cancel-button{display:none}
.search-x{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--ink-2);font-size:17px;cursor:pointer}
.toast.err{background:var(--expense);color:#fff}
body.lock .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
.skel{border-radius:18px;background:var(--sunk);margin-bottom:12px;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* gate (התחברות) */
.hidden{display:none!important}
.gate{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 24px 40px}
.gate h1{font-size:30px;font-weight:780;letter-spacing:-.03em;margin-bottom:6px}
.gate p.muted{margin-bottom:22px;line-height:1.55}
.gate .input{margin-bottom:10px;text-align:left}
.gate .btn{margin-top:4px}
.g-err{color:var(--expense);font-size:14px;min-height:20px;margin:2px 2px 8px}
.g-err.ok{color:var(--income)}
.g-or{text-align:center;color:var(--ink-3);font-size:13px;margin:14px 0}
/* עדכון מלא */
.bulk-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.bulk-name{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bulk-in{width:132px;padding:10px 12px;border-radius:12px;background:var(--sunk);border:1.5px solid transparent;font-size:16px;font-weight:650;direction:ltr;text-align:left;outline:0;font-variant-numeric:tabular-nums}
.bulk-in:focus{border-color:var(--accent)}
.bulk-total{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 0;margin-top:12px;border-top:1px solid var(--line);font-weight:650}
.bulk-total b{font-size:20px}

/* חיווי סנכרון */
.sync.waiting,.sync.syncing{cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sync.syncing::before{animation:pulse .9s ease-in-out infinite alternate}
.sync.waiting{background:#FDF1D8;color:#6A4A06}
.sync.done{background:color-mix(in srgb,var(--income) 16%,var(--surface));color:var(--income)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sync.waiting{background:#3A2E12;color:#F1D48A}}
:root[data-theme="dark"] .sync.waiting{background:#3A2E12;color:#F1D48A}

/* סביבת בדיקה */
.beta-bar{position:sticky;top:0;z-index:70;background:#D9822B;color:#fff;text-align:center;font-weight:700;font-size:13px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 7px}
body.beta .app{padding-top:16px}
body.beta .gate{padding-top:36px}

<script type="module">
(function(){
'use strict';

/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d);};
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const shiftMonth=(mk,k)=>{const p=mk.split('-').map(Number);return monthKey(new Date(p[0],p[1]-1+k,1));};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const r2=x=>Math.round(x*100)/100;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const F={
  month:new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}),
  monthOnly:new Intl.DateTimeFormat('he-IL',{month:'long'}),
  dayLong:new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}),
  dayShort:new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'short'}),
  short:new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'short',year:'2-digit'}),
  dt:new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
  n0:new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),
  n2:new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
};
function money(n,o){
  o=o||{};
  const a=Math.abs(n),s=(o.dec&&!Number.isInteger(r2(a))?F.n2:F.n0).format(a);   // אגורות: או בלי, או שתי ספרות (364.70, לא 364.7)
  const pre=s==='0'?'':(n<0?'−':(o.sign&&n>0?'+':''));
  return '<span class="num">'+pre+'<span class="cs">₪</span>'+s+'</span>';
}
function compact(n){
  const a=Math.abs(n),s=n<0?'-':'';
  if(a>=1e6)return s+(a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(a>=1e3)return s+(a/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'K';
  return s+Math.round(a);
}
const pct=(v,t)=>t?Math.round(v/t*100):0;
const monthName=mk=>F.month.format(parseYmd(mk+'-01'));
function dayLabel(s){if(s===todayStr())return'היום';if(s===yesterdayStr())return'אתמול';return F.dayLong.format(parseYmd(s));}
function dayShort(s){if(s===todayStr())return'היום';if(s===yesterdayStr())return'אתמול';return F.dayShort.format(parseYmd(s));}
function relDay(ts){
  if(!ts)return'';
  const s=ymd(new Date(ts));
  if(s===todayStr())return'היום';
  if(s===yesterdayStr())return'אתמול';
  const days=Math.max(2,Math.floor((Date.now()-ts)/864e5));
  if(days<60)return'לפני '+days+' ימים';
  const m=Math.round(days/30);
  if(m<12)return m===2?'לפני חודשיים':'לפני '+m+' חודשים';
  return'ב־'+F.short.format(new Date(ts));
}
function parseAmount(v){
  const s=String(v||'').replace(/[,\s₪]/g,'');
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
  return r2(parseFloat(s));
}
/* סכום שיכול להיות שלילי (עו"ש במינוס). neg=false: כמו parseAmount */
function parseSigned(v,neg){
  const m=/^\s*[-−]/.test(String(v||''));
  if(!m)return parseAmount(v);
  return neg?-parseAmount(String(v).replace(/^\s*[-−]/,'')):NaN;
}
function firstGlyph(s){
  s=String(s||'').trim();
  if(!s)return'';
  if(typeof Intl!=='undefined'&&Intl.Segmenter){
    const it=new Intl.Segmenter('he',{granularity:'grapheme'}).segment(s)[Symbol.iterator]().next();
    return it.value?it.value.segment:s;
  }
  return Array.from(s).slice(0,2).join('');
}

const firebaseConfig = {

  messagingSenderId: "559069571788",

};

// הגרסה הקודמת: נטענת רק אם החדשה לא נטענה (כדי שהאפליקציה לא תיתקע על מסך טעינה)

  ['סופר','🛒','expense','#4E9A5F'],['אוכל בחוץ','☕','expense','#D0663A'],['תחבורה ודלק','🚗','expense','#3F6FB5'],
  ['דיור וחשבונות','🏠','expense','#B3568A'],['פנאי','🎬','expense','#7153A8'],['קניות','🛍️','expense','#C83E52'],
  ['משכורת','💼','income','#2A98A8'],['הכנסה נוספת','✨','income','#C9A12E']
];

  chevR:'<svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',

};

const defaultCats=()=>DEFAULT_CATS.map(([name,icon,type,color],i)=>({id:uid(),name,icon,type,color,ord:i+1}));

/* ================= state ================= */
const S={
  tx:{categories:[],transactions:[]},
  nw:{assets:[],liabilities:[],history:[]},
  rec:[],
  view:'home',month:monthKey(new Date()),txType:'all',txCat:null,txAcct:null,txQ:'',range:'all',
  catTab:'expense',histOpen:false,brkOpen:false,setPage:null,newVer:false,live:false,early:false,earlyWrites:0,form:null,ready:false,user:null,loaded:{},quick:false,noAccess:false,verifyNote:'',monthLoaded:{},monthCache:{}
};

/* ================= storage ================= */
/* expense/income: תנועה רגילה (אופציונלית עם accountId). transfer: fromId→toId, בלי קטגוריה.
   adjust: רשומת עדכון/התאמה של יתרת חשבון (accountId, delta, value). לא נספרת בתזרים ובחיסכון */
const TX_TYPES=['expense','income','transfer','adjust'];
function normTx(o){
  o=o||{};
  const cats=(Array.isArray(o.categories)?o.categories:[]).filter(c=>c&&c.id&&c.name).map(c=>({
    id:String(c.id),name:String(c.name),icon:String(c.icon||'🏷️'),ord:+c.ord||0,
    type:c.type==='income'?'income':'expense',
    color:/^#[0-9a-f]{6}$/i.test(c.color)?c.color:PALETTE[8]
  }));
  const txs=(Array.isArray(o.transactions)?o.transactions:[]).filter(t=>t&&t.id&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&isFinite(+t.amount)).map(t=>({
    id:String(t.id),type:TX_TYPES.includes(t.type)?t.type:'expense',amount:r2(+t.amount),
    categoryId:t.categoryId?String(t.categoryId):null,catName:String(t.catName||''),date:t.date,note:String(t.note||''),createdAt:+t.createdAt||0,
    ...(t.accountId?{accountId:String(t.accountId)}:{}),
    ...(t.type==='transfer'?{fromId:String(t.fromId||''),toId:String(t.toId||'')}:{}),
    ...(t.type==='adjust'?{delta:r2(+t.delta||0),value:r2(+t.value||0)}:{}),
    ...(t.recId?{recId:String(t.recId)}:{}),
    ...(t.inst&&+t.inst.n>1?{inst:{i:+t.inst.i||1,n:+t.inst.n}}:{})
  }));
  return{categories:cats,transactions:txs};
}
/* תבנית של תנועה חוזרת (R3). count/total רק לתשלומים. lastMonth = החודש האחרון שבו נוצרה תנועה */
function normRec(a){
  const num=v=>isFinite(+v)?+v:0,mk=v=>/^\d{4}-\d{2}$/.test(v)?v:null;
  return (Array.isArray(a)?a:[]).filter(r=>r&&r.id&&mk(r.startMonth)&&['expense','income','transfer'].includes(r.type)).map(r=>Object.assign({
    id:String(r.id),type:r.type,amount:r2(num(r.amount)),categoryId:r.categoryId?String(r.categoryId):null,catName:String(r.catName||''),
    note:String(r.note||''),day:Math.min(31,Math.max(1,Math.round(num(r.day))||1)),startMonth:r.startMonth,lastMonth:mk(r.lastMonth),
    paused:!!r.paused,createdAt:num(r.createdAt)},
    r.accountId?{accountId:String(r.accountId)}:{},
    r.type==='transfer'?{fromId:String(r.fromId||''),toId:String(r.toId||'')}:{},
    num(r.count)>1?Object.assign({count:Math.round(num(r.count)),total:r2(num(r.total))},r.paid!=null&&isFinite(+r.paid)?{paid:r2(+r.paid)}:{}):{}));
}
function normNw(o){
  o=o||{};
  const num=v=>isFinite(+v)?+v:0;
  const items=(a,cats)=>(Array.isArray(a)?a:[]).filter(x=>x&&x.id).map(x=>({
    id:String(x.id),name:String(x.name||''),category:cats.some(c=>c.id===x.category)?x.category:'other',
    value:r2(num(x.value)),updatedAt:num(x.updatedAt)
  }));
  const hist=(Array.isArray(o.history)?o.history:[]).filter(p=>p&&isFinite(+p.t)&&isFinite(+p.n))

  return{assets:items(o.assets,ASSET_CATS),liabilities:items(o.liabilities,LIAB_CATS),history:hist};

/* ================= מראה ================= */
const THEME_KEY='fin-theme';
function getTheme(){try{const t=localStorage.getItem(THEME_KEY);return t==='light'||t==='dark'?t:'auto';}catch(e){return 'auto';}}
function setTheme(t){
  try{if(t==='auto')localStorage.removeItem(THEME_KEY);else localStorage.setItem(THEME_KEY,t);}catch(e){}
  const root=document.documentElement;
  if(t==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
  const metas=document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach(m=>{
    const light=/light/.test(m.getAttribute('media')||'');
    m.setAttribute('content',t==='dark'?'#0D1316':t==='light'?'#F2F4F1':(light?'#F2F4F1':'#0D1316'));
  });
}

/* ---------- תנועות: טעינה לפי צורך ----------

const TXS={src:{}};
function txRebuild(){
  const m=new Map();
  Object.keys(TXS.src).forEach(k=>TXS.src[k].forEach((t,id)=>m.set(id,t)));
  S.tx.transactions=Array.from(m.values());
}
function txSource(key,docs){
  TXS.src[key]=new Map(normTx({transactions:docs}).transactions.map(t=>[t.id,t]));
  txRebuild();
}
function wantedMonths(){
  const w=new Set([monthKey(new Date())]);
  if(S.view==='tx')w.add(S.month);
  return w;
}
function syncMonths(){if(S.ready&&D.setMonths)D.setMonths(wantedMonths());}
const T0=typeof performance!=='undefined'?performance.now():0,TIMES={};   // זמני פתיחה, מוצגים בהגדרות של הבטא

/* ---------- תמונת מצב שמורה: מה שהמסך צריך, נשמר בטלפון (לפי סביבה ומשתמש) ----------
   ההתחברות מאמתת את המשתמש מול הרשת בכל פתיחה (שנייה וחצי עד שתיים בטלפון), ועד אז גם הנתונים השמורים של Firestore
   לא מגיעים. לכן בפתיחה מציגים מיד מהתמונה השמורה, מתחילים את המאזינים עם המשתמש השמור, והנתונים האמיתיים מחליפים אותה. */
const SNAP_KEY='fin-snap-'+ENV;
let snapT=0;
function saveSnapSoon(){
  if(!S.live||!S.user||S.noAccess)return;
  clearTimeout(snapT);
  snapT=setTimeout(()=>{
    if(!S.live||!S.user||S.noAccess)return;
    try{
      const cur=monthKey(new Date()),keep=new Set(TXS.src.recent?TXS.src.recent.keys():[]);
      localStorage.setItem(SNAP_KEY,JSON.stringify({v:1,uid:S.user.uid,email:S.user.email||'',t:Date.now(),
        cats:S.tx.categories,tx:S.tx.transactions.filter(t=>t.date.slice(0,7)===cur||keep.has(t.id)),
        assets:S.nw.assets,liabs:S.nw.liabilities,hist:S.nw.history,rec:S.rec}));
    }catch(e){console.warn(e);}
  },800);
}
function loadSnap(){
  try{const o=JSON.parse(localStorage.getItem(SNAP_KEY)||'null');return o&&o.v===1&&o.uid&&Array.isArray(o.tx)?o:null;}catch(e){return null;}
}
function clearSnap(){clearTimeout(snapT);try{localStorage.removeItem(SNAP_KEY);}catch(e){}}
/* פתיחה מהתמונה השמורה: המאזינים כבר רצים (enter), והמסך מצויר מיד */
function enterEarly(snap){
  S.early=true;S.earlyWrites=0;
  enter({uid:snap.uid,email:snap.email,emailVerified:true});
  S.tx.categories=normTx({categories:snap.cats}).categories.sort((x,y)=>x.ord-y.ord);
  txSource('snap',snap.tx);   // מקור זמני, עד שהתנועות האמיתיות מגיעות
  S.nw=normNw({assets:snap.assets,liabilities:snap.liabs,history:snap.hist});
  S.rec=normRec(snap.rec);
  S.monthLoaded[monthKey(new Date())]=true;
  S.ready=true;mark('view');render();
  if(S.quick){S.quick=false;openTxSheet();}
}

function markLoaded(k){
  S.loaded[k]=true;
  const first=!S.live&&LOAD_KEYS.every(x=>S.loaded[x]);
  if(first){mark('data');mark('view');S.live=true;S.ready=true;if(TXS.src.snap){delete TXS.src.snap;txRebuild();}try{ensureMonthlyPoint();}catch(e){console.error(e);}setTimeout(async()=>{await backfillPaid();genRecurring();},0);}
  if(S.ready)render();
  if(first&&S.quick){S.quick=false;openTxSheet();}
  if(first)checkNewVersion();
}


/* ---------- חיווי סנכרון ---------- */
const SYNC={n:0,shown:null,showT:0,slowT:0,doneT:0};
const SYNC_TXT={syncing:'מסנכרן…',waiting:'ממתין לסנכרון',done:'הכול מסונכרן'};
function syncChip(state){
  const el=$('#sync');if(!el)return;
  SYNC.shown=state;
  if(!state){el.className='sync hidden';el.textContent='';return;}
  el.className='sync '+state;el.textContent=SYNC_TXT[state];
}
function syncUpdate(){
  clearTimeout(SYNC.doneT);
  if(SYNC.n>0){
    if(SYNC.shown==='done')syncChip(null);
    if(navigator.onLine===false){
      clearTimeout(SYNC.showT);clearTimeout(SYNC.slowT);SYNC.showT=0;SYNC.slowT=0;
      syncChip('waiting');return;
    }
    if(SYNC.shown==='waiting')syncChip('syncing');
    if(!SYNC.showT&&!SYNC.shown){
      SYNC.showT=setTimeout(()=>{SYNC.showT=0;if(SYNC.n>0&&!SYNC.shown)syncChip('syncing');},700);
    }
    clearTimeout(SYNC.slowT);
    SYNC.slowT=setTimeout(()=>{SYNC.slowT=0;if(SYNC.n>0)syncChip('waiting');},5000);
  }else{
    clearTimeout(SYNC.showT);clearTimeout(SYNC.slowT);SYNC.showT=0;SYNC.slowT=0;
    if(SYNC.shown){syncChip('done');SYNC.doneT=setTimeout(()=>syncChip(null),2000);}
  }
}
function syncBegin(){SYNC.n++;syncUpdate();}
function syncEnd(){SYNC.n=Math.max(0,SYNC.n-1);syncUpdate();}

/*FB-START*/
const D={
  uid:null,unsubs:[],seeding:false,
  async init(){
    const load=v=>{const base='https://www.gstatic.com/firebasejs/'+v+'/';return Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);};
    let mods;this.ver=FB_VER;
    try{mods=await load(FB_VER);}catch(e){console.error(e);this.ver=FB_VER_PREV;mods=await load(FB_VER_PREV);}
    const [app,auth,fs]=mods;
    this.A=auth;this.F=fs;
    // לבטא יש "אפליקציה" נפרדת בשם beta, ולכן מטמון מקומי והתחברות נפרדים מהייצור (הם באותה כתובת בדפדפן).
    // סיבה: גרסה חדשה של הספרייה משדרגת את מבנה המטמון, וגרסה ישנה כבר לא יכולה לפתוח אותו.
    // בלי ההפרדה, ניסוי בבטא היה משבית את העבודה בלי חיבור בייצור. בייצור השם נשאר ברירת המחדל, כמו תמיד.
    this.app=ENV==='beta'?app.initializeApp(firebaseConfig,'beta'):app.initializeApp(firebaseConfig);
    // התחברות באימייל וסיסמה בלבד. getAuth() מוסיף גם את מנגנון הכניסה בחלון קופץ, שב-Safari נטען מהרשת
    // לפני שההתחברות השמורה מדווחת, ומעכב את כל הפתיחה. לכן initializeAuth בלי המנגנון הזה, עם אותה שמירה מקומית
    try{this.auth=auth.initializeAuth(this.app,{persistence:[auth.indexedDBLocalPersistence,auth.browserLocalPersistence,auth.browserSessionPersistence]});}
    catch(e){console.warn(e);this.auth=auth.getAuth(this.app);}
    try{
      this.db=fs.initializeFirestore(this.app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
    }catch(e){console.warn(e);this.db=fs.getFirestore(this.app);}
  },
  onAuth(cb){return this.A.onAuthStateChanged(this.auth,cb);},
  envRoot(env){return env==='beta'?['users',this.uid,'beta','main']:['users',this.uid];},
  col(n){return this.F.collection(this.db,...this.envRoot(ENV),n);},
  ref(n,id){return this.F.doc(this.db,...this.envRoot(ENV),n,id);},
  fail(e){
    console.error(e);
    if(!S.user)return;   // כבר לא מחוברים (למשל ההתחברות השמורה פגה): מסך הכניסה כבר מוצג
    if(e&&e.code==='permission-denied'){showNoAccess();return;}
    toast('השמירה נכשלה – נסה שוב'+errTag(e),'err');
  },
  w(p){if(S.early)S.earlyWrites++;syncBegin();p.catch(e=>this.fail(e)).finally(syncEnd);},
  listen(name,apply){
    this.unsubs.push(this.F.onSnapshot(this.col(name),snap=>{
      apply(snap.docs.map(d=>Object.assign({id:d.id},d.data())));
      markLoaded(name);
    },e=>this.fail(e)));
  },
  start(user){
    this.stop();this.uid=user.uid;
    syncBegin();this.F.waitForPendingWrites(this.db).catch(()=>{}).finally(syncEnd);
    this.unsubs.push(this.F.onSnapshot(this.ref('meta','profile'),{includeMetadataChanges:true},snap=>{
      if(!snap.exists()&&!snap.metadata.fromCache&&!this.seeding){this.seeding=true;this.seed();}
      markLoaded('profile');
    },e=>this.fail(e)));
    this.listen('categories',a=>{S.tx.categories=normTx({categories:a}).categories.sort((x,y)=>x.ord-y.ord);});
    this.unsubs.push(this.F.onSnapshot(this.F.query(this.col('tx'),this.F.orderBy('date','desc'),this.F.limit(10)),snap=>{
      txSource('recent',snap.docs.map(d=>Object.assign({id:d.id},d.data())));
      markLoaded('recent');
    },e=>this.fail(e)));
    this.listen('assets',a=>{S.nw.assets=normNw({assets:a}).assets;});
    this.listen('liabilities',a=>{S.nw.liabilities=normNw({liabilities:a}).liabilities;});
    this.listen('history',a=>{S.nw.history=normNw({history:a}).history;});
    this.listen('recurring',a=>{S.rec=normRec(a);});
    this.setMonths(wantedMonths());
  },
  monthSubs:{},
  setMonths(want){
    let removed=false;
    Object.keys(this.monthSubs).forEach(mk=>{
      if(!want.has(mk)){
        try{this.monthSubs[mk]();}catch(e){}
        delete this.monthSubs[mk];delete TXS.src['m:'+mk];S.monthLoaded[mk]=false;delete S.monthCache[mk];removed=true;
      }
    });
    if(removed)txRebuild();
    want.forEach(mk=>{if(!this.monthSubs[mk])this.watchMonth(mk);});
  },
  watchMonth(mk){
    const F=this.F;
    const q=F.query(this.col('tx'),F.where('date','>=',mk+'-01'),F.where('date','<',shiftMonth(mk,1)+'-01'));
    this.monthSubs[mk]=F.onSnapshot(q,snap=>{
      txSource('m:'+mk,snap.docs.map(d=>Object.assign({id:d.id},d.data())));
      S.monthLoaded[mk]=true;S.monthCache[mk]=snap.metadata.fromCache;
      if(mk===monthKey(new Date()))markLoaded('month');else if(S.ready)render();
    },e=>this.fail(e));
  },
  stop(){
    this.unsubs.forEach(u=>{try{u();}catch(e){}});this.unsubs=[];this.seeding=false;
    Object.keys(this.monthSubs).forEach(k=>{try{this.monthSubs[k]();}catch(e){}});
    this.monthSubs={};TXS.src={};S.monthLoaded={};S.monthCache={};
  },
  /* קריאות חד-פעמיות מהשרת (לא מהמטמון) */
  async txIds(){return (await this.F.getDocsFromServer(this.col('tx'))).docs.map(d=>d.id);},
  async allTx(){
    const snap=await this.F.getDocsFromServer(this.col('tx'));
    return normTx({transactions:snap.docs.map(d=>Object.assign({id:d.id},d.data()))}).transactions;
  },
  async countCat(id){
    const F=this.F;
    return (await F.getCountFromServer(F.query(this.col('tx'),F.where('categoryId','==',id)))).data().count;
  },
  async stats(cats){
    const F=this.F,col=this.col('tx');
    const tot=await F.getCountFromServer(col);
    const rows=await Promise.all(cats.map(c=>F.getCountFromServer(F.query(col,F.where('categoryId','==',c.id))).then(r=>[c.id,r.data().count])));
    const byCat={};rows.forEach(([id,n])=>{byCat[id]=n;});
    return {total:tot.data().count,byCat};
  },
  seed(){
    const b=this.F.writeBatch(this.db);
    b.set(this.ref('meta','profile'),{seeded:true,createdAt:Date.now()});
    defaultCats().forEach(c=>{const {id,...r}=c;b.set(this.ref('categories',id),r);});
    this.w(b.commit());
  },
  putCat(c){const {id,...r}=c;this.w(this.F.setDoc(this.ref('categories',id),r));},
  delCat(id){this.w(this.F.deleteDoc(this.ref('categories',id)));},
  putTx(t){const {id,...r}=t;this.w(this.F.setDoc(this.ref('tx',id),r));},
  /* R3: יצירת תנועה חוזרת לחודש mk, רק אם התבנית עוד לא טופלה בחודש הזה (עסקה אטומית מול השרת) */
  async recGenerate(recId,mk,build){
    syncBegin();
    try{
      return await this.F.runTransaction(this.db,async tr=>{
        const ref=this.ref('recurring',recId),snap=await tr.get(ref);
        if(!snap.exists())return null;
        const d=snap.data();
        if(d.paused||(d.lastMonth&&d.lastMonth>=mk))return null;
        const {t,fx}=build(d),{id,...r}=t;
        tr.set(this.ref('tx',id),r);
        fx.forEach(e=>tr.update(this.ref(this.itemCol(e.kind),e.id),{value:this.F.increment(e.d)}));
        tr.update(ref,Object.assign({lastMonth:mk},t.inst&&d.paid!=null?{paid:this.F.increment(t.amount)}:{}));
        return{t,fx};
      });
    }finally{syncEnd();}
  },
  /* תבנית חדשה, יחד עם התנועות שהיום שלהן כבר הגיע (עובד גם בלי חיבור). txs: מערך או null */
  putRec(r,txs,fx){
    const {id,...rr}=r,ops=[{ref:this.ref('recurring',id),data:rr}];
    (txs||[]).forEach(t=>{const {id:tid,...tt}=t;ops.push({ref:this.ref('tx',tid),data:tt});});
    (fx||[]).forEach(e=>ops.push({ref:this.ref(this.itemCol(e.kind),e.id),update:true,data:{value:this.F.increment(e.d)}}));
    this.w(this.runOps(ops));
  },
  updRec(id,data){this.w(this.F.updateDoc(this.ref('recurring',id),data));},
  delRec(id){this.w(this.F.deleteDoc(this.ref('recurring',id)));},
  async recPaidSum(id){
    const F=this.F,snap=await F.getDocsFromServer(F.query(this.col('tx'),F.where('recId','==',id)));
    return r2(snap.docs.reduce((s,d)=>s+(+d.data().amount||0),0));
  },
  /* ביטול יצירה: מוחקים את התבנית ואת התנועה הראשונה, ומחזירים את היתרות */
  undoRec(id,txs,fx){
    const ops=[{ref:this.ref('recurring',id),del:true}];
    (txs||[]).forEach(t=>ops.push({ref:this.ref('tx',t.id),del:true}));
    (fx||[]).forEach(e=>ops.push({ref:this.ref(this.itemCol(e.kind),e.id),update:true,data:{value:this.F.increment(e.d)}}));
    this.w(this.runOps(ops));
  },
  /* תנועה + עדכון יתרות באותה פעולה. increment מתחבר נכון גם כששני מכשירים או מצב לא מקוון כותבים במקביל */
  txWrite(t,fx,paidFx){
    const b=this.F.writeBatch(this.db);
    if(t.del)b.delete(this.ref('tx',t.id));else{const {id,...r}=t;b.set(this.ref('tx',id),r);}
    (fx||[]).forEach(e=>b.update(this.ref(this.itemCol(e.kind),e.id),{value:this.F.increment(e.d)}));
    (paidFx||[]).forEach(e=>b.update(this.ref('recurring',e.id),{paid:this.F.increment(e.d)}));
    this.w(b.commit());
  },
  delTx(id){this.w(this.F.deleteDoc(this.ref('tx',id)));},
  itemCol(kind){return kind==='asset'?'assets':'liabilities';},
  /* delta===undefined: פריט חדש (set). אחרת עריכה: הערך משתנה בהפרש (increment), כדי לא לדרוס תנועה שנכתבה במקביל ממכשיר אחר */
  putItem(kind,x,pt,rec,delta){
    const b=this.F.writeBatch(this.db),{id,...r}=x;
    if(delta===undefined)b.set(this.ref(this.itemCol(kind),id),r);
    else b.update(this.ref(this.itemCol(kind),id),Object.assign({name:x.name,category:x.category,updatedAt:x.updatedAt},delta?{value:this.F.increment(delta)}:{}));
    if(pt)b.set(this.ref('history',String(pt.t)),pt);
    if(rec){const {id:rid,...rr}=rec;b.set(this.ref('tx',rid),rr);}
    this.w(b.commit());
  },
  delItem(kind,id,pt){
    const b=this.F.writeBatch(this.db);
    b.delete(this.ref(this.itemCol(kind),id));
    if(pt)b.set(this.ref('history',String(pt.t)),pt);
    this.w(b.commit());
  },
  delHist(t){this.w(this.F.deleteDoc(this.ref('history',String(t))));},
  putHist(p){this.w(this.F.setDoc(this.ref('history',String(p.t)),p));},
  /* ביטול פעולה על נכס/התחייבות: prev=הגרסה הקודמת (או null אם הפריט נוסף עכשיו ולכן נמחק),
     ptT=הנקודה שנוספה לגרף בפעולה ועכשיו נמחקת */
  revertItem(kind,id,prev,ptT,recId,delta){
    const b=this.F.writeBatch(this.db);
    if(prev&&delta!==undefined)b.update(this.ref(this.itemCol(kind),id),Object.assign({name:prev.name,category:prev.category,updatedAt:prev.updatedAt},delta?{value:this.F.increment(-delta)}:{}));
    else if(prev){const {id:_,...r}=prev;b.set(this.ref(this.itemCol(kind),id),r);}else b.delete(this.ref(this.itemCol(kind),id));
    if(ptT)b.delete(this.ref('history',String(ptT)));
    if(recId)b.delete(this.ref('tx',recId));
    this.w(b.commit());
  },
  /* ups: {kind,id,d,updatedAt}. d = ההפרש בערך (0 = רק סימון "עודכן"). לא כותבים ערך מוחלט, כדי לא לדרוס שינוי מקביל */
  bulk(ups,pt,recs){
    const ops=ups.map(u=>({ref:this.ref(this.itemCol(u.kind),u.id),update:true,data:Object.assign({updatedAt:u.updatedAt},u.d?{value:this.F.increment(u.d)}:{})}));
    if(pt)ops.push({ref:this.ref('history',String(pt.t)),data:pt});
    (recs||[]).forEach(r=>{const {id,...d}=r;ops.push({ref:this.ref('tx',id),data:d});});
    this.w(this.runOps(ops));
  },
  bulkRevert(ups,ptT,recIds){
    const ops=ups.map(u=>({ref:this.ref(this.itemCol(u.kind),u.id),update:true,data:Object.assign({updatedAt:u.updatedAt},u.d?{value:this.F.increment(-u.d)}:{})}));
    if(ptT)ops.push({ref:this.ref('history',String(ptT)),del:true});
    (recIds||[]).forEach(id=>ops.push({ref:this.ref('tx',id),del:true}));
    this.w(this.runOps(ops));
  },
  /* כל כתיבה בודקת את allowlist בכללי האבטחה (קריאת exists אחת), ו-Firestore מגביל batch ל-20 קריאות כאלה.
     לכן כותבים ב-batch-ים קטנים של 10, עד 4 במקביל. */
  async runOps(ops){
    const SIZE=10,PAR=4,chunks=[];
    for(let i=0;i<ops.length;i+=SIZE)chunks.push(ops.slice(i,i+SIZE));
    let next=0;
    const worker=async()=>{
      while(next<chunks.length){
        const ch=chunks[next++],b=this.F.writeBatch(this.db);
        ch.forEach(o=>{if(o.del)b.delete(o.ref);else if(o.update)b.update(o.ref,o.data);else b.set(o.ref,o.data);});
        await b.commit();
      }
    };
    await Promise.all(Array.from({length:Math.min(PAR,chunks.length)},worker));
  },
  async importAll(tx,nw,rec){
    syncBegin();
    try{await this._importAll(tx,nw,rec);}finally{syncEnd();}
  },
  async _importAll(tx,nw,rec){
    const ops=[];
    (rec||[]).forEach(r=>{const {id,...d}=r;ops.push({ref:this.ref('recurring',id),data:d});});
    tx.categories.forEach(c=>{const {id,...r}=c;ops.push({ref:this.ref('categories',id),data:r});});
    tx.transactions.forEach(t=>{const {id,...r}=t;ops.push({ref:this.ref('tx',id),data:r});});
    nw.assets.forEach(x=>{const {id,...r}=x;ops.push({ref:this.ref('assets',id),data:r});});
    nw.liabilities.forEach(x=>{const {id,...r}=x;ops.push({ref:this.ref('liabilities',id),data:r});});
    nw.history.forEach(p=>ops.push({ref:this.ref('history',String(p.t)),data:p}));
    await this.runOps(ops);
  },
  async wipe(old,cats){
    syncBegin();
    try{await this._wipe(old,cats);}finally{syncEnd();}
  },
  async _wipe(old,cats){
    const ops=[];
    old.cats.forEach(id=>ops.push({ref:this.ref('categories',id),del:true}));
    old.txs.forEach(id=>ops.push({ref:this.ref('tx',id),del:true}));
    old.assets.forEach(id=>ops.push({ref:this.ref('assets',id),del:true}));
    old.liabs.forEach(id=>ops.push({ref:this.ref('liabilities',id),del:true}));
    old.hist.forEach(id=>ops.push({ref:this.ref('history',id),del:true}));
    (old.recs||[]).forEach(id=>ops.push({ref:this.ref('recurring',id),del:true}));
    cats.forEach(c=>{const {id,...r}=c;ops.push({ref:this.ref('categories',id),data:r});});
    try{await this.runOps(ops);}catch(e){console.error(e);toast('המחיקה לא הושלמה. נסו שוב'+errTag(e),'err');}
  },
  /* ---- כלים לסביבת הבדיקה בלבד. קוראים מהייצור, אף פעם לא כותבים אליו ---- */
  async readAll(env){
    const out={};
    for(const c of DATA_COLS){
      const snap=await this.F.getDocsFromServer(this.F.collection(this.db,...this.envRoot(env),c));
      out[c]=snap.docs.map(d=>({id:d.id,data:d.data()}));
    }
    return out;
  },
  betaRef(c,id){return this.F.doc(this.db,...this.envRoot('beta'),c,id);},
  async betaCopyFromProd(){
    if(ENV!=='beta')throw new Error('beta only');
    syncBegin();
    try{
      const prod=await this.readAll('prod'),beta=await this.readAll('beta'),ops=[];
      DATA_COLS.forEach(c=>{
        const keep=new Set(prod[c].map(x=>x.id));
        beta[c].forEach(x=>{if(!keep.has(x.id))ops.push({ref:this.betaRef(c,x.id),del:true});});
        prod[c].forEach(x=>ops.push({ref:this.betaRef(c,x.id),data:x.data}));
      });
      await this.runOps(ops);
      return DATA_COLS.reduce((n,c)=>n+prod[c].length,0);
    }finally{syncEnd();}
  },
  async betaWipe(){
    if(ENV!=='beta')throw new Error('beta only');
    syncBegin();
    try{
      const beta=await this.readAll('beta'),ops=[];
      DATA_COLS.forEach(c=>beta[c].forEach(x=>ops.push({ref:this.betaRef(c,x.id),del:true})));
      this.seeding=false;   // מאפשר זריעה מחדש של קטגוריות ברירת המחדל אחרי הניקוי
      await this.runOps(ops);
      return ops.length;
    }finally{syncEnd();}
  },
  async reconnect(){
    try{await this.F.disableNetwork(this.db);}catch(e){}
    try{await this.F.enableNetwork(this.db);}catch(e){console.error(e);}
  },
  signOut(){return this.A.signOut(this.auth);}
};

/* ================= domain ================= */
const catView=id=>S.tx.categories.find(c=>c.id===id)||NONE;
const catKey=t=>S.tx.categories.some(c=>c.id===t.categoryId)?t.categoryId:'_none';

/* ================= חשבונות (R2) ================= */
function acctOf(id){
  if(!id)return null;
  let x=S.nw.assets.find(i=>i.id===id);if(x)return{kind:'asset',x};
  x=S.nw.liabilities.find(i=>i.id===id);return x?{kind:'liab',x}:null;
}
const acctName=id=>{const a=acctOf(id);return a?a.x.name:'חשבון שנמחק';};
const acctCat=a=>(a.kind==='asset'?ASSET_CATS:LIAB_CATS).find(c=>c.id===a.x.category)||ASSET_CATS[ASSET_CATS.length-1];
const isLive=a=>!!a&&acctGroup(a.kind,a.x.category)==='live';
/* כל החשבונות לפי סדר הקבוצות: שוטף, חיסכון, חובות */
function allAccts(){
  const all=[...S.nw.assets.map(x=>({kind:'asset',x})),...S.nw.liabilities.map(x=>({kind:'liab',x}))];
  const ord={live:0,save:1,debt:2};
  return all.map((a,i)=>({a,i,g:ord[acctGroup(a.kind,a.x.category)]})).sort((p,q)=>p.g-q.g||p.i-q.i).map(o=>o.a);
}
const liveAccts=()=>allAccts().filter(isLive);
/* השפעת תנועה על יתרות: [{id,kind,d}] כש-d הוא השינוי בשדה value.
   נכס: כסף יוצא = פחות. התחייבות (כרטיס אשראי): כסף יוצא = החוב גדל */
function txEffects(t){
  const out=[];
  const add=(id,dir)=>{const a=acctOf(id);if(a)out.push({id,kind:a.kind,d:(a.kind==='asset'?1:-1)*dir*t.amount});};
  if(t.type==='expense'&&t.accountId)add(t.accountId,-1);
  else if(t.type==='income'&&t.accountId)add(t.accountId,1);
  else if(t.type==='transfer'){add(t.fromId,-1);add(t.toId,1);}
  else if(t.type==='adjust'&&t.accountId){const a=acctOf(t.accountId);if(a)out.push({id:t.accountId,kind:a.kind,d:t.delta||0});}
  return out;
}
function mergeFx(list){
  const m=new Map();
  for(const e of list){const k=e.kind+'|'+e.id,o=m.get(k);if(o)o.d=r2(o.d+e.d);else m.set(k,Object.assign({},e,{d:r2(e.d)}));}
  return [...m.values()].filter(e=>e.d!==0);
}
const negFx=fx=>fx.map(e=>Object.assign({},e,{d:-e.d}));
function applyFxLocal(fx){for(const e of fx){const a=acctOf(e.id);if(a)a.x.value=r2(a.x.value+e.d);}}
/* שמירה/מחיקה של תנועה יחד עם עדכון היתרות (prev = הגרסה הקודמת בעריכה) */
/* תשלום שנערך/נמחק/הוחזר משנה את "שולם" בתבנית, כדי שהיתרה תתחלק מחדש על התשלומים הבאים */
function paidFx(t,prev){
  const m=new Map(),add=(x,s)=>{if(!x||!x.inst||!x.recId)return;m.set(x.recId,(m.get(x.recId)||0)+s*x.amount);};
  add(t,1);add(prev,-1);
  const out=[];
  m.forEach((d,id)=>{const r=S.rec.find(x=>x.id===id);d=r2(d);if(r&&r.paid!=null&&d){r.paid=r2(r.paid+d);out.push({id,d});}});
  return out;
}
function saveTxFx(t,prev){const fx=mergeFx([...(prev?negFx(txEffects(prev)):[]),...txEffects(t)]);applyFxLocal(fx);D.txWrite(t,fx,paidFx(t,prev));}
function delTxFx(t){const fx=mergeFx(negFx(txEffects(t)));applyFxLocal(fx);D.txWrite({id:t.id,del:true},fx,paidFx(null,t));}
/* ================= תנועות חוזרות ותשלומים (R3) ================= */
const monthsDiff=(a,b)=>(+b.slice(0,4)*12+ +b.slice(5,7))-(+a.slice(0,4)*12+ +a.slice(5,7));
function dayIn(mk,day){const last=new Date(+mk.slice(0,4),+mk.slice(5,7),0).getDate();return mk+'-'+String(Math.min(day,last)).padStart(2,'0');}
/* תשלומים שווים; השארית (אגורות) בתשלום הראשון, כמו בחברות האשראי */
function instAmount(r,i){const base=Math.floor(r.total/r.count*100)/100;return i===1?r2(r.total-base*(r.count-1)):base;}
/* כמה שולם עד עכשיו: paid אם ידוע (b3), אחרת לפי החלוקה המקורית */
function recPaid(r,upto){
  if(r.paid!=null)return r.paid;
  let s=0;for(let i=1;i<upto;i++)s+=instAmount(r,i);return r2(s);
}
/* סכום התשלום i. מה שנשאר מתחלק שווה על התשלומים שנשארו; האחרון סוגר את האגורות.
   כך עריכה או מחיקה של תשלום מתחלקת מחדש על הבאים */
function payAmount(r,i){
  if(r.paid==null||i===1&&!r.paid)return instAmount(r,i);
  const left=Math.max(0,r2(r.total-r.paid)),k=r.count-i+1;
  if(k<=1)return left;
  return Math.floor(left/k*100)/100;
}
const recNext=r=>r.lastMonth?shiftMonth(r.lastMonth,1):r.startMonth;
const recIndex=(r,mk)=>monthsDiff(r.startMonth,mk)+1;
const recDone=r=>!!r.count&&(recIndex(r,recNext(r))>r.count||(r.paid!=null&&r.total-r.paid<0.005));
const recLabel=r=>r.note||(r.type==='transfer'?acctName(r.fromId)+' ← '+acctName(r.toId):(catView(r.categoryId).id==='_none'?r.catName:catView(r.categoryId).name))||'תנועה חוזרת';
/* התנועה של חודש mk. מזהה דטרמיניסטי (תבנית+חודש), כדי ששני מכשירים לא ייצרו כפילות */
function recTx(r,mk){
  const i=r.count?recIndex(r,mk):0;
  return Object.assign({id:'r-'+r.id+'-'+mk,type:r.type,amount:i?payAmount(r,i):r.amount,categoryId:r.categoryId,catName:r.catName,
    date:dayIn(mk,r.day),note:r.note,createdAt:Date.now(),recId:r.id},
    r.type==='transfer'?{fromId:r.fromId,toId:r.toId}:(r.accountId?{accountId:r.accountId}:{}),
    i?{inst:{i,n:r.count}}:{});
}
/* החודשים שהגיע זמנם ועוד לא נוצרו (כולל השלמה של חודשים שהוחמצו) */
function recDue(r){
  const out=[],today=todayStr(),cur=monthKey(new Date());
  if(r.paused)return out;
  for(let m=recNext(r);m<=cur;m=shiftMonth(m,1)){
    if(r.count&&recIndex(r,m)>r.count)break;
    if(r.count&&r.paid!=null&&r.total-r.paid<0.005)break;
    if(dayIn(m,r.day)>today)break;
    out.push(m);
  }
  return out;
}
/* כמה נשאר לשלם בתשלומים שעוד לא נוצרו */
function recRemaining(r){
  if(!r.count)return 0;
  return Math.max(0,r2(r.total-recPaid(r,recIndex(r,recNext(r)))));
}
const committedInst=()=>r2(S.rec.reduce((s,r)=>s+recRemaining(r),0));
/* צפוי עוד החודש: תבניות שהיום שלהן החודש עוד לא הגיע */
function expectedThisMonth(){
  const cur=monthKey(new Date()),today=todayStr(),o={exp:0,inc:0};
  for(const r of S.rec){
    if(r.paused||recNext(r)!==cur||dayIn(cur,r.day)<=today)continue;
    if(r.count&&recIndex(r,cur)>r.count)continue;
    const a=r.count?payAmount(r,recIndex(r,cur)):r.amount;
    if(r.type==='expense')o.exp+=a;else if(r.type==='income')o.inc+=a;
  }
  return{exp:r2(o.exp),inc:r2(o.inc)};
}
/* תבניות תשלומים מלפני b3 (בלי paid): מחשבים פעם אחת מהתשלומים שכבר נוצרו (קריאה מהשרת, רק עם חיבור) */
async function backfillPaid(){
  if(navigator.onLine===false)return;
  for(const r of S.rec.filter(x=>x.count&&x.paid==null)){
    try{const sum=await D.recPaidSum(r.id);r.paid=sum;D.updRec(r.id,{paid:sum});}catch(e){console.error(e);return;}
  }
}
/* יוצרת את התנועות שהגיע זמנן. כל חודש בפעולה אטומית מול השרת (רק עם חיבור), כך ששני מכשירים לא ייצרו פעמיים */
let recBusy=false;
async function genRecurring(){
  if(recBusy||!S.live||!S.rec.length||navigator.onLine===false)return;
  recBusy=true;let n=0;
  try{
    for(const r of S.rec.slice()){
      for(const m of recDue(r)){
        // הסכום מחושב מהעותק שבשרת בתוך העסקה (paid עדכני גם אם מכשיר אחר שינה)
        const build=d=>{const rr=normRec([Object.assign({},d,{id:r.id})])[0];const t=recTx(rr,m);return{t,fx:mergeFx(txEffects(t))};};
        let res;
        try{res=await D.recGenerate(r.id,m,build);}catch(e){console.error(e);return;}
        r.lastMonth=m;
        if(!res)continue;
        const {t,fx}=res;
        if(r.count)r.paid=r2((r.paid!=null?r.paid:recPaid(r,recIndex(r,m)))+t.amount);
        n++;
        if(wantedMonths().has(m)&&!S.tx.transactions.some(x=>x.id===t.id))S.tx.transactions.push(t);
        applyFxLocal(fx);
      }
    }
  }finally{
    recBusy=false;
    if(n){render();toast(n===1?'נוספה תנועה חוזרת':'נוספו '+n+' תנועות חוזרות');}
  }
}
/* החשבון האחרון נזכר בנפרד להוצאה ולהכנסה (לכל מכשיר). העברות לא משנות אותו */
const lastAcctKey=type=>'fin-last-acct-'+ENV+'-'+(type==='income'?'income':'expense');
function lastAcct(type){try{const id=localStorage.getItem(lastAcctKey(type));return id==='none'?null:(isLive(acctOf(id))?id:null);}catch(e){return null;}}
function setLastAcct(type,id){try{localStorage.setItem(lastAcctKey(type),id||'none');}catch(e){}}
/* העברות והתאמות לא נספרות בהכנסות, בהוצאות, בתזרים ובחיסכון */
function sumTx(list){let inc=0,exp=0;for(const t of list){if(t.type==='income')inc+=t.amount;else if(t.type==='expense')exp+=t.amount;}return{inc:r2(inc),exp:r2(exp),net:r2(inc-exp)};}
const isFlow=t=>t.type==='income'||t.type==='expense';
const flowSigned=t=>t.type==='income'?t.amount:t.type==='expense'?-t.amount:0;
/* מה מוצג ברשימות: הכול חוץ מעדכוני שווי של חשבונות חיסכון וחובות (הם לא תנועות) */
const txVisible=t=>t.type!=='adjust'||isLive(acctOf(t.accountId));
/* "הושקע": העברות מכסף שוטף לחיסכון, פחות משיכות מהחיסכון לכסף השוטף */
function investedOf(list){
  let s=0;
  for(const t of list){
    if(t.type!=='transfer')continue;
    const f=acctOf(t.fromId),to=acctOf(t.toId);if(!f||!to)continue;
    const gf=acctGroup(f.kind,f.x.category),gt=acctGroup(to.kind,to.x.category);
    if(gf==='live'&&gt==='save')s+=t.amount;else if(gf==='save'&&gt==='live')s-=t.amount;
  }
  return r2(s);
}
const sortTx=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0);
function nwTotals(){
  const a=r2(S.nw.assets.reduce((s,x)=>s+x.value,0));
  const l=r2(S.nw.liabilities.reduce((s,x)=>s+x.value,0));
  return{a,l,n:r2(a-l)};
}
function snapshot(note){
  const t=nwTotals(),h=S.nw.history,last=h[h.length-1];
  if(last&&r2(last.a)===t.a&&r2(last.l)===t.l)return null;
  const pt={t:Date.now(),a:t.a,l:t.l,n:t.n,note};
  h.push(pt);
  return pt;
}
/* הנקודה האחרונה בגרף היא תמיד השווי של עכשיו (מוצגת בלבד, לא נשמרת), כדי שהגרף והמספר הגדול יתאימו */
function histWithNow(){
  const h=S.nw.history,t=nwTotals(),last=h[h.length-1];
  if(!S.nw.assets.length&&!S.nw.liabilities.length)return h;
  if(last&&r2(last.a)===t.a&&r2(last.l)===t.l)return h;
  return h.concat([{t:Math.max(Date.now(),last?last.t+1:0),a:t.a,l:t.l,n:t.n,note:'עכשיו',live:true}]);
}
/* נקודה שמורה אחת בחודש: בפתיחה הראשונה בחודש, אם אין עדיין נקודה בחודש הזה והשווי השתנה */
function ensureMonthlyPoint(){
  const mk=monthKey(new Date());
  if(S.autoPointMk===mk)return;S.autoPointMk=mk;
  if(!S.nw.assets.length&&!S.nw.liabilities.length)return;
  const h=S.nw.history,last=h[h.length-1];
  if(last&&monthKey(new Date(last.t))===mk)return;
  const pt=snapshot('נקודה חודשית');
  if(pt)D.putHist(pt);
}
function rangePoints(){
  const h=histWithNow();
  if(S.range==='all'||h.length<2)return h;
  const d=new Date();d.setMonth(d.getMonth()-({'3m':3,'6m':6,'1y':12}[S.range]||0));
  const from=d.getTime();
  const idx=h.findIndex(p=>p.t>=from);
  if(idx===-1)return[h[h.length-1]];
  return h.slice(Math.max(0,idx-1));
}
/* כמה פעמים נבחרה כל קטגוריה: נשמר לכל מכשיר, כדי שהסדר בחלון ההוספה לא יתאפס בתחילת כל חודש.
   התנועות שנטענו (החודש הנוכחי) משמשות רצפה, למכשיר חדש */
const CAT_USE_KEY='fin-cat-use-'+ENV;
function catUse(){try{const o=JSON.parse(localStorage.getItem(CAT_USE_KEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return{};}}
function bumpCatUse(id){if(!id)return;try{const o=catUse();o[id]=(+o[id]||0)+1;localStorage.setItem(CAT_USE_KEY,JSON.stringify(o));}catch(e){}}
function usageCounts(){
  const m={},st=catUse();
  for(const t of S.tx.transactions)m[t.categoryId]=(m[t.categoryId]||0)+1;
  for(const k in st)m[k]=Math.max(m[k]||0,+st[k]||0);
  return m;
}

/* ================= UI bits ================= */
let toastTimer,undoFn=null;
const UNDO_MS=5000;
/* undo: פונקציה שמחזירה את המצב הקודם. מוצג כפתור "בטל" ל-5 שניות */
function toast(msg,kind,undo){
  const el=$('#toast');
  undoFn=typeof undo==='function'?undo:null;
  if(undoFn)el.innerHTML='<span>'+esc(msg)+'</span><button class="toast-undo" data-a="undo">בטל</button>';
  else el.textContent=msg;
  el.className='toast show'+(kind?' '+kind:'')+(undoFn?' undo':'');
  clearTimeout(toastTimer);
  if(kind==='busy')return;   // הודעת "עובד…" נשארת עד ההודעה הבאה
  toastTimer=setTimeout(()=>{el.className='toast';undoFn=null;},undoFn?UNDO_MS:2300);
}
function runUndo(){
  const fn=undoFn;undoFn=null;clearTimeout(toastTimer);$('#toast').className='toast';
  if(fn)fn();
}
/* בסביבת הבדיקה מוסיפים להודעות שגיאה את קוד השגיאה (בייצור לא מציגים מונחים טכניים) */
/* ---------- קריאה מהשרת עם ניסיון חוזר ----------
   על נתונים ניידים החיבור הפתוח לשרת נתקע לפעמים בלי שגיאה, וקריאה פשוט לא נענית. ניסיון חדש פותח חיבור חדש ומצליח.
   לכן: אם אין תשובה תוך NET_WAIT[0], מתחברים מחדש ומנסים פעם אחת נוספת (NET_WAIT[1]). רק אחריה מציגים שגיאה.
   הספירה נשמרת בטלפון ומוצגת בהגדרות של הבטא, כדי לדעת אם התקיעה ממשיכה לקרות מאחורי הקלעים. */
const NET_WAIT=window.__NET_WAIT||[10000,15000];
const RETRY_KEY='fin-retry-'+ENV;
function retryStats(){try{const o=JSON.parse(localStorage.getItem(RETRY_KEY)||'{}');return{n:+o.n||0,ok:+o.ok||0,t:+o.t||0};}catch(e){return{n:0,ok:0,t:0};}}
function retryBump(ok){try{const o=retryStats();if(ok)o.ok++;else{o.n++;o.t=Date.now();}localStorage.setItem(RETRY_KEY,JSON.stringify(o));}catch(e){}}
function timed(p,ms){
  p.catch(()=>{});   // תשובה מאוחרת של ניסיון שכבר ויתרנו עליו לא צריכה להפוך לשגיאה
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{code:'timeout'})),ms))]);
}
async function withRetry(fn,busyMsg){
  try{return await timed(fn(),NET_WAIT[0]);}
  catch(e){
    if(!e||e.code!=='timeout'||navigator.onLine===false)throw e;
    console.warn('no answer, reconnecting and trying again');
    retryBump(false);
    if(busyMsg)toast(busyMsg,'busy');
    await D.reconnect();
    const r=await timed(fn(),NET_WAIT[1]);
    retryBump(true);
    return r;
  }
}
function errTag(e){return ENV==='beta'&&e?' ('+String(e.code||e.name||e.message||e).slice(0,60)+')':'';}
function askConfirm(msg,opt){
  opt=opt||{};
  return new Promise(res=>{
    const d=$('#dialog');
    d.innerHTML='<div class="dlg"><p>'+esc(msg)+'</p><div class="row"><button class="btn ghost grow" data-r="0">ביטול</button><button class="btn grow '+(opt.danger?'danger solid':'primary')+'" data-r="1">'+esc(opt.ok||'אישור')+'</button></div></div>';
    d.classList.add('open');
    d.onclick=e=>{
      const b=e.target.closest('[data-r]');
      if(!b&&e.target!==d)return;
      d.classList.remove('open');d.onclick=null;
      res(!!b&&b.dataset.r==='1');
    };
  });
}

/* החלקה למטה סוגרת חלון: רק כשהחלון גלול לגמרי למעלה, ורק בתנועה אנכית (לא בגלילה לצדדים של שורות) */
(function sheetSwipe(){
  const sh=document.getElementById('sheet');if(!sh)return;
  let y0=0,x0=0,t0=0,dy=0,drag=false,armed=false;
  const pt=e=>e.touches&&e.touches[0]||e.changedTouches&&e.changedTouches[0]||e;
  sh.addEventListener('touchstart',e=>{
    if(!sh.classList.contains('open'))return;
    const p=pt(e);y0=p.clientY;x0=p.clientX;t0=Date.now();dy=0;drag=false;armed=sh.scrollTop<=0;
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!armed)return;
    const p=pt(e),d=p.clientY-y0,dx=p.clientX-x0;
    if(!drag){
      if(d>8&&Math.abs(d)>Math.abs(dx)*1.2&&sh.scrollTop<=0){drag=true;sh.style.transition='none';}
      else if(Math.abs(dx)>8||d<-8){armed=false;return;}
      else return;
    }
    dy=Math.max(0,d);sh.style.transform='translateY('+dy+'px)';
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  const end=()=>{
    if(!drag){armed=false;return;}
    drag=false;armed=false;
    const v=dy/Math.max(1,Date.now()-t0);
    sh.style.transition='';sh.style.transform='';
    if(dy>110||(dy>40&&v>0.5))closeSheet();
  };
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);
})();
const sheetHead=t=>'<div class="sheet-head"><h2>'+esc(t)+'</h2><button class="icon-btn" data-a="sheet-close" aria-label="סגירה">'+ICON.x+'</button></div>';
function fitSheet(){
  const vv=window.visualViewport,sh=$('#sheet');
  if(!vv||!sh)return;
  if(!sh.classList.contains('open')){sh.style.bottom='';sh.style.maxHeight='';sh.classList.remove('kb');return;}
  const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  sh.classList.toggle('kb',kb>80);   // מקלדת פתוחה: פס פעולות נמוך, בלי המרווח של תחתית המסך
  sh.style.bottom=kb+'px';
  sh.style.maxHeight=Math.min(vv.height-10,window.innerHeight*.92)+'px';
}

/* ================= chart ================= */
function drawChart(el,pts){
  if(!el)return;
  const W=Math.max(240,Math.round(el.clientWidth||320));
  const H=+el.dataset.h||150;
  if(!pts.length){
    el.innerHTML='<div class="chart-empty">הוסף את הנכס הראשון כדי להתחיל לעקוב אחרי השווי הנקי<br><button class="btn primary" data-a="asset-add">הוספת נכס</button></div>';
    return;
  }
  const pl=44,pr=12,pt=12,pb=24,n=pts.length,iw=W-pl-pr,ih=H-pt-pb;
  const vals=pts.map(p=>p.n);
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(hi-lo<1){const d=Math.max(Math.abs(hi)*.05,1000);lo-=d;hi+=d;}
  const padv=(hi-lo)*.12;lo-=padv;hi+=padv;
  const X=i=>n===1?pl+iw/2:pl+iw*i/(n-1);
  const Y=v=>pt+ih*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.n).toFixed(1)).join('');
  const area=line+'L'+X(n-1).toFixed(1)+','+(pt+ih)+'L'+X(0).toFixed(1)+','+(pt+ih)+'Z';
  const gid='grad-'+(el.dataset.chart||'c');
  let grid='';
  for(let k=0;k<=3;k++){
    const v=lo+(hi-lo)*k/3,yy=Y(v).toFixed(1);
    grid+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="gt" x="'+(pl-8)+'" y="'+(+yy+4)+'" text-anchor="end">'+compact(v)+'</text>';
  }
  const xl=n>1
    ?'<text class="gt" x="'+pl+'" y="'+(H-5)+'" text-anchor="start">'+F.short.format(new Date(pts[0].t))+'</text><text class="gt" x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end">'+F.short.format(new Date(pts[n-1].t))+'</text>'
    :'<text class="gt" x="'+X(0)+'" y="'+(H-5)+'" text-anchor="middle">'+F.short.format(new Date(pts[0].t))+'</text>';
  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף מגמת שווי נקי">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--chart-line);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--chart-line);stop-opacity:0"/></linearGradient></defs>'+
    grid+(n>1?'<path d="'+area+'" fill="url(#'+gid+')"/><path class="ln" d="'+line+'"/>':'')+
    '<circle class="dl" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(pts[n-1].n).toFixed(1)+'" r="5"/>'+xl+
    '<g class="xh" style="display:none"><line class="xl" y1="'+pt+'" y2="'+(pt+ih)+'"/><circle class="xc" r="5.5"/></g></svg><div class="tip"></div>';
  const svg=el.querySelector('svg'),xh=svg.querySelector('.xh'),tip=el.querySelector('.tip');
  let hideT;
  const show=e=>{
    clearTimeout(hideT);
    const r=svg.getBoundingClientRect();
    let i=n===1?0:Math.round((e.clientX-r.left-pl)/iw*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    const p=pts[i],cx=X(i),cy=Y(p.n);
    xh.style.display='';
    const ln=xh.querySelector('line');ln.setAttribute('x1',cx);ln.setAttribute('x2',cx);
    const c=xh.querySelector('circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);
    tip.innerHTML='<b>'+money(p.n)+'</b><span>'+esc(F.short.format(new Date(p.t)))+'</span>';
    tip.style.left=Math.max(56,Math.min(W-56,cx))+'px';
    tip.classList.add('on');
  };
  const hide=()=>{xh.style.display='none';tip.classList.remove('on');};
  el.onpointerdown=show;
  el.onpointermove=show;
  el.onpointerleave=e=>{if(e.pointerType==='mouse')hide();};
  el.onpointerup=e=>{if(e.pointerType!=='mouse'){hideT=setTimeout(hide,2200);}};
  el.onpointercancel=hide;
}

/* שיעור חיסכון = (הכנסות פחות הוצאות) חלקי הכנסות. rate=null כשאין מה לחשב או כשההוצאות גבוהות מההכנסות */
function saveRate(inc,exp){
  if(!(inc>0))return{rate:null,text:'עוד לא נרשמו הכנסות בחודש הזה.'};
  if(exp>inc)return{rate:null,text:'ההוצאות עולות על ההכנסות החודש.'};
  const rate=pct(inc-exp,inc);
  return{rate,text:'חסכת '+rate+'% מההכנסות.',html:'חסכת <b>'+rate+'%</b> מההכנסות'};
}
/* חיפוש בחודש שמוצג: מספר = לפי סכום (120 מוצא 120 ו-120.50) או בהערה; טקסט = בהערה ובשם הקטגוריה */
function matchQ(t,q){
  q=q.trim().toLowerCase();if(!q)return true;
  const note=(t.note||'').toLowerCase();
  const num=q.replace(/[₪,\s]/g,'');
  if(/^\d+(\.\d+)?$/.test(num)){
    const n=+num,hit=num.includes('.')?r2(t.amount)===r2(n):Math.floor(t.amount)===n;
    return hit||note.includes(q);
  }
  const accts=[t.accountId,t.fromId,t.toId].filter(Boolean).map(id=>acctName(id).toLowerCase());
  if(accts.some(n=>n.includes(q)))return true;
  if(!isFlow(t))return note.includes(q)||(t.type==='transfer'?'העברה':'התאמת יתרה').includes(q);
  return note.includes(q)||catView(catKey(t)).name.toLowerCase().includes(q)||(t.catName||'').toLowerCase().includes(q);
}

  else{const sr=saveRate(inc,exp);hint=sr.rate===null?'<p class="hint">'+sr.text+'</p>':'<p class="save-rate">'+sr.html+'</p>';}
  const ex=expectedThisMonth();
  if(ex.exp||ex.inc)hint+='<p class="hint">צפוי עוד החודש: '+[ex.exp?'הוצאות <b>'+money(ex.exp)+'</b>':'',ex.inc?'הכנסות <b>'+money(ex.inc)+'</b>':''].filter(Boolean).join(' · ')+'</p>';
