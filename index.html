<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעקב פיננסי</title>
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כספים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#14202B; --muted:#66737F; --line:#DAE1E7;
  --soft:#E3EAEE; --accent:#0E5A66; --accent-ink:#FFFFFF; --pos:#2A8A58; --neg:#CC533B;
  --shadow:0 6px 20px rgba(14,90,102,.28);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E151B;--surface:#16212A;--ink:#E7EDF1;--muted:#8997A3;--line:#243440;--soft:#1D2B35;
    --accent:#49B0BD;--accent-ink:#06242A;--pos:#4DBB84;--neg:#EE8068;--shadow:0 6px 20px rgba(0,0,0,.45)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',-apple-system,'SF Hebrew','Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(150px + var(--sb))}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.loading{padding:120px 20px;text-align:center;color:var(--muted)}

/* hero */
.hero{padding:calc(var(--st) + 22px) 20px 8px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.hero-top .lbl{font-weight:500;color:var(--ink);font-size:15px}
.big{font-size:54px;font-weight:300;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.delta{font-size:14px;margin-top:4px}
.hero .chart{margin:14px -20px 0}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%}
.axis{display:flex;justify-content:space-between;padding:6px 20px 0;font-size:12px;color:var(--muted);direction:ltr}
.axis span{direction:rtl;unicode-bidi:isolate}
.hero-empty{padding:18px 0 10px}
.hero-empty p{margin:6px 0 14px;color:var(--muted)}

/* sections */
.sec{padding:22px 20px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-h h2{margin:0;font-size:16px;font-weight:500}
.mon{display:flex;align-items:center;gap:4px;font-size:15px}
.mon button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.mon button:active{background:var(--soft)}
.mon button[disabled]{opacity:.3}
.mon span{min-width:96px;text-align:center}

.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flow small{display:block;color:var(--muted);font-size:13px}
.flow b{font-size:20px;font-weight:500}
.bar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--pos) 35%,var(--soft));margin:16px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--neg);border-radius:5px}
.bar.none{background:var(--soft)}
.flow-note{font-size:14px;color:var(--muted)}

.cats{display:flex;flex-direction:column}
.cat{display:block;width:100%;text-align:start;padding:10px 0}
.cat-r{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.cat-b{height:5px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}
.cat-b i{display:block;height:100%;border-radius:3px}
.empty{color:var(--muted);padding:6px 0}

/* transactions */
.tx-head{padding:calc(var(--st) + 18px) 20px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--surface);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum-line{padding:0 20px 8px;color:var(--muted);font-size:14px}
.day{padding:16px 20px 6px;font-size:13px;color:var(--muted)}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 20px;border-bottom:1px solid var(--line)}
.tx:active{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tx-m{flex:1;min-width:0}
.tx-m b{font-weight:400;display:block}
.tx-m small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-a{font-size:16px;font-weight:500}

/* net worth tab */
.net-top{padding:calc(var(--st) + 22px) 20px 4px}
.read{font-size:14px;color:var(--muted);min-height:20px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:13px}
.sub{display:flex;justify-content:space-between;margin-bottom:6px;font-size:15px}
.sub b{font-weight:500}
.chev{color:var(--muted);flex:none}

/* settings */
.set-h{padding:calc(var(--st) + 22px) 20px 6px;font-size:22px;font-weight:500}
.note{background:var(--soft);padding:12px 14px;border-radius:12px;font-size:14px;color:var(--muted);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;background:var(--soft);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.block{display:flex;width:100%}
.btn:active{filter:brightness(.94)}
.btn.link{background:none;min-height:40px;color:var(--accent)}
.addrow{margin-top:8px}
.ver{padding:8px 20px;color:var(--muted);font-size:12px;text-align:center}

/* nav */
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sb);z-index:20}
.tabs>div{max-width:520px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted)}
.tab.on{color:var(--accent);font-weight:500}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + var(--sb));z-index:19;display:flex;align-items:center;gap:8px;height:52px;padding:0 24px;border-radius:26px;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:17px;box-shadow:var(--shadow)}
.fab:active{filter:brightness(.92)}
.hidden{display:none!important}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(10,20,28,.5)}
.panel{position:absolute;bottom:0;inset-inline:0;margin:0 auto;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:18px 20px calc(20px + var(--sb));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel h3{margin:0 0 14px;font-size:18px;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{padding:9px 0;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amt{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 14px;direction:ltr}
.amt span{font-size:30px;font-weight:300;color:var(--muted)}
.amt input{width:60%;min-width:0;border:0;background:none;font-size:46px;font-weight:300;text-align:center;outline:none;direction:ltr}
.amt input::placeholder{color:var(--line)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick .chip.on{border-color:transparent;color:#fff}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--soft);padding:0 14px;font-size:16px;outline:none}
.inp:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.err{color:var(--neg);font-size:14px;min-height:20px;margin:0 0 8px}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .primary{flex:1}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.frow span{flex:1}
.frow input{width:150px;min-height:42px;border:0;border-radius:10px;background:var(--soft);padding:0 12px;text-align:left;outline:none;font-size:16px}
.fgroup{font-weight:500;margin:16px 0 4px}
.tot{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);margin-top:10px;font-weight:500}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw button{width:34px;height:34px;border-radius:50%}
.sw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(132px + var(--sb));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* auth */
#auth{max-width:420px;margin:0 auto;padding:calc(var(--st) + 56px) 24px 40px}
#auth h1{font-size:30px;font-weight:300;margin:0 0 6px}
#auth p{color:var(--muted);margin:0 0 26px}
#auth .inp{margin-bottom:10px}
#auth .btn{margin-top:4px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div id="auth" class="hidden"></div>
<div id="app"><div class="loading">טוען…</div></div>
<button class="fab hidden" id="fab" data-a="fab"></button>
<nav class="tabs hidden" id="tabs"><div></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" class="hidden">

<script type="module">
/* ============================================================
   הגדרות Firebase
   להדביק כאן את הערכים מהקונסול של Firebase (ראו README).
   כל עוד הערכים לא הוגדרו, האפליקציה עובדת במצב מקומי בלבד.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyABjCxXlE5fXH6KmyKTFFb4rsnOg2hdYsw",
  authDomain: "finance-track-8e6b6.firebaseapp.com",
  projectId: "finance-track-8e6b6",
  storageBucket: "finance-track-8e6b6.firebasestorage.app",
  messagingSenderId: "559069571788",
  appId: "1:559069571788:web:1cc9476232f89fbd3c7069"
};
const FB_VER = '10.14.1';

/* ---------- עזרים ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = s => s.slice(0, 7);
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('he-IL', {month:'long', year:'numeric'}); };
const shiftMonth = (ym, d) => { let [y, m] = ym.split('-').map(Number); m += d; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const dateObj = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dayLabel = s => dateObj(s).toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'long'});
const shortDate = s => dateObj(s).toLocaleDateString('he-IL', {day:'numeric', month:'short', year:'2-digit'});
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = new Intl.NumberFormat('he-IL', {maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('he-IL', {maximumFractionDigits:2});
const num = (n, o = {}) => { const r = o.exact ? Math.round(n * 100) / 100 : Math.round(n); const neg = r < 0; const sg = neg ? '-' : (o.sign && r > 0 ? '+' : ''); return `<span class="n">${sg}₪${(o.exact ? nf2 : nf).format(Math.abs(r))}</span>`; };
const parseAmount = v => { const x = parseFloat(String(v).replace(/,/g, '').replace(/[^\d.\-]/g, '')); return isFinite(x) ? Math.round(x * 100) / 100 : NaN; };
const PALETTE = ['#C8503A','#D98324','#A08A1E','#5E9B3F','#23855A','#238D99','#3569C0','#6553BF','#A4519F','#7B8794'];
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); };

function defaultSettings() {
  return {
    categories: [
      {id:'food', name:'מזון וסופר', type:'expense', color:PALETTE[0]},
      {id:'eat', name:'מסעדות וקפה', type:'expense', color:PALETTE[1]},
      {id:'transport', name:'תחבורה', type:'expense', color:PALETTE[6]},
      {id:'home', name:'דיור וחשבונות', type:'expense', color:PALETTE[5]},
      {id:'fun', name:'בילויים', type:'expense', color:PALETTE[8]},
      {id:'health', name:'בריאות', type:'expense', color:PALETTE[4]},
      {id:'shop', name:'קניות', type:'expense', color:PALETTE[7]},
      {id:'subs', name:'מנויים', type:'expense', color:PALETTE[2]},
      {id:'other_e', name:'אחר', type:'expense', color:PALETTE[9]},
      {id:'salary', name:'משכורת', type:'income', color:PALETTE[4]},
      {id:'other_i', name:'הכנסה אחרת', type:'income', color:PALETTE[3]}
    ],
    assets: [
      {id:'gemel', name:'קופות גמל'}, {id:'hishtalmut', name:'קרן השתלמות'}, {id:'pension', name:'פנסיה'},
      {id:'trading', name:'תיק מסחר עצמאי'}, {id:'cash', name:'מזומן ועו״ש'}, {id:'realestate', name:'נדל״ן'},
      {id:'other_a', name:'אחר'}
    ],
    liabilities: [
      {id:'loans', name:'הלוואות'}, {id:'mortgage', name:'משכנתא'}, {id:'other_l', name:'אחר'}
    ]
  };
}

/* ---------- מצב ---------- */
const S = {user:null, settings:null, tx:[], snaps:[], tab:'home', month:ymOf(todayStr()), filter:'all'};
const chartData = {};
const isConfigured = () => firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE');
const MODE = isConfigured() ? 'fb' : 'local';
let DB = null;

const catById = id => S.settings.categories.find(c => c.id === id);
const catInfo = t => { const c = catById(t.categoryId); return {name: c ? c.name : (t.categoryName || 'ללא קטגוריה'), color: c ? c.color : '#7B8794'}; };
const snapsAsc = () => [...S.snaps].sort((a, b) => a.date.localeCompare(b.date));
const monthTx = ym => S.tx.filter(t => t.date.startsWith(ym));
const sums = list => { let inc = 0, exp = 0; for (const t of list) { if (t.type === 'income') inc += t.amount; else exp += t.amount; } return {inc, exp, net: inc - exp}; };

/* ---------- אחסון מקומי (גיבוי כשאין Firebase) ---------- */
const Local = {
  key: 'finance-app-v1',
  save() { try { localStorage.setItem(this.key, JSON.stringify({settings:S.settings, tx:S.tx, snaps:S.snaps})); } catch (e) { toast('השמירה במכשיר נכשלה'); } },
  start() {
    let d = {}; try { d = JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) {}
    S.settings = d.settings || defaultSettings(); S.tx = d.tx || []; S.snaps = d.snaps || [];
  },
  stop() {},
  putTx(t) { upsert(S.tx, t); this.save(); render(); },
  delTx(id) { S.tx = S.tx.filter(t => t.id !== id); this.save(); render(); },
  putSettings(s) { S.settings = s; this.save(); render(); },
  putSnap(s) { upsert(S.snaps, s); this.save(); render(); },
  delSnap(id) { S.snaps = S.snaps.filter(s => s.id !== id); this.save(); render(); },
  async importAll(d) {
    if (d.settings) S.settings = d.settings;
    d.transactions.forEach(t => upsert(S.tx, t));
    d.snapshots.forEach(s => upsert(S.snaps, s));
    this.save(); render();
  }
};

/* ---------- Firebase ---------- */
const FS = {
  uid: null, unsubs: [],
  async init() {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [app, auth, fs] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
    ]);
    this.A = auth; this.F = fs;
    this.app = app.initializeApp(firebaseConfig);
    this.auth = auth.getAuth(this.app);
    this.db = fs.initializeFirestore(this.app, {
      localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})
    });
  },
  onAuth(cb) { return this.A.onAuthStateChanged(this.auth, cb); },
  col(n) { return this.F.collection(this.db, 'users', this.uid, n); },
  ref(n, id) { return this.F.doc(this.db, 'users', this.uid, n, id); },
  fail(e) { console.error(e); toast('השמירה נכשלה: ' + (e.code || 'שגיאה')); },
  start(user) {
    this.stop(); this.uid = user.uid;
    const F = this.F, err = e => console.error(e);
    this.unsubs.push(F.onSnapshot(this.ref('meta', 'settings'), snap => {
      if (snap.exists()) { S.settings = snap.data(); }
      else {
        // כותבים ברירות מחדל רק אחרי שהשרת אישר שאין הגדרות (לא ממטמון ריק)
        S.settings = defaultSettings();
        if (!snap.metadata.fromCache) F.setDoc(this.ref('meta', 'settings'), S.settings).catch(e => this.fail(e));
      }
      render();
    }, err));
    this.unsubs.push(F.onSnapshot(this.col('transactions'), snap => {
      S.tx = snap.docs.map(d => ({id: d.id, ...d.data()})); render();
    }, err));
    this.unsubs.push(F.onSnapshot(this.col('snapshots'), snap => {
      S.snaps = snap.docs.map(d => ({id: d.id, ...d.data()})); render();
    }, err));
  },
  stop() { this.unsubs.forEach(u => u()); this.unsubs = []; },
  putTx(t) { const {id, ...r} = t; this.F.setDoc(this.ref('transactions', id), r).catch(e => this.fail(e)); },
  delTx(id) { this.F.deleteDoc(this.ref('transactions', id)).catch(e => this.fail(e)); },
  putSettings(s) { S.settings = s; render(); this.F.setDoc(this.ref('meta', 'settings'), s).catch(e => this.fail(e)); },
  putSnap(s) { const {id, ...r} = s; this.F.setDoc(this.ref('snapshots', id), r).catch(e => this.fail(e)); },
  delSnap(id) { this.F.deleteDoc(this.ref('snapshots', id)).catch(e => this.fail(e)); },
  async importAll(d) {
    const F = this.F, ops = [];
    if (d.settings) ops.push([this.ref('meta', 'settings'), d.settings]);
    d.transactions.forEach(t => { const {id, ...r} = t; ops.push([this.ref('transactions', id), r]); });
    d.snapshots.forEach(s => { const {id, ...r} = s; ops.push([this.ref('snapshots', id), r]); });
    for (let i = 0; i < ops.length; i += 400) {
      const b = F.writeBatch(this.db);
      ops.slice(i, i + 400).forEach(([ref, data]) => b.set(ref, data));
      await b.commit();
    }
  }
};

/* ---------- תצוגות ---------- */
const ICON = {

  trend:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',

/* בכיוון RTL: "הקודם" מימין, אז החץ שלו פונה ימינה */
ICON.prev = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

const monthSwitch = () => `<div class="mon">
  <button data-a="month:-1" aria-label="חודש קודם">${ICON.prev}</button>
  <span>${monthLabel(S.month)}</span>
  <button data-a="month:1" aria-label="חודש הבא" ${S.month >= ymOf(todayStr()) ? 'disabled' : ''}>${ICON.next}</button></div>`;

function viewHome() {
  const snaps = snapsAsc(), last = snaps.at(-1), prev = snaps.at(-2);
  let hero;
  if (last) {
    chartData.home = snaps.map(s => ({date: s.date, v: s.net}));
    const d = prev ? last.net - prev.net : null;
    hero = `<section class="hero">
      <div class="hero-top"><span class="lbl">שווי נקי</span><span>עודכן ב־${shortDate(last.date)}</span></div>
      <div class="big">${num(last.net)}</div>
      ${d !== null ? `<div class="delta ${d >= 0 ? 'pos' : 'neg'}">${num(d, {sign:true})} מאז העדכון הקודם</div>` : ''}
      <div class="chart" data-chart="home" data-h="112"></div></section>`;
  } else {
    hero = `<section class="hero"><div class="hero-top"><span class="lbl">שווי נקי</span></div>
      <div class="hero-empty"><p>עדיין אין נתונים. הזינו את הסכומים הנוכחיים בכל הנכסים וההתחייבויות, וכל עדכון עתידי יוסיף נקודה לגרף.</p>
      <button class="btn primary" data-a="net">עדכון ראשון</button></div></section>`;
  }
  const list = monthTx(S.month), {inc, exp, net} = sums(list);
  const pct = inc > 0 ? Math.min(exp / inc, 1) * 100 : (exp > 0 ? 100 : 0);
  let note = '';
  if (inc > 0) note = exp <= inc ? `נשארו ${num(inc - exp)} מההכנסות` : `ההוצאות גבוהות מההכנסות ב־${num(exp - inc)}`;
  else if (exp > 0) note = 'לא נרשמו הכנסות החודש';
  const flow = `<section class="sec"><div class="sec-h"><h2>תזרים חודשי</h2>${monthSwitch()}</div>
    <div class="flow"><div><small>הכנסות</small><b class="${inc > 0 ? 'pos' : ''}">${num(inc)}</b></div>
    <div><small>הוצאות</small><b>${num(exp)}</b></div>
    <div><small>נטו</small><b class="${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${num(net, {sign:true})}</b></div></div>
    ${list.length ? `<div class="bar ${inc > 0 ? '' : 'none'}"><i style="width:${pct}%"></i></div><div class="flow-note">${note}</div>` : '<div class="empty" style="margin-top:12px">אין עדיין תנועות החודש. לחצו על הוספה כדי להתחיל.</div>'}
    </section>`;
  const groups = {};
  list.filter(t => t.type === 'expense').forEach(t => {
    const k = t.categoryId || t.categoryName || '?';
    (groups[k] = groups[k] || {info: catInfo(t), key: t.categoryId || '', sum: 0}).sum += t.amount;
  });
  const rows = Object.values(groups).sort((a, b) => b.sum - a.sum);
  const max = rows[0]?.sum || 1;
  const cats = rows.length ? `<section class="sec"><div class="sec-h"><h2>לאן הלך הכסף</h2></div><div class="cats">${rows.map(r => `
    <button class="cat" data-a="cat:${esc(r.key)}"><div class="cat-r"><span>${esc(r.info.name)}</span><b style="font-weight:500">${num(r.sum)}</b></div>
    <div class="cat-b"><i style="width:${r.sum / max * 100}%;background:${r.info.color}"></i></div></button>`).join('')}</div></section>` : '';
  return hero + flow + cats;
}

function viewTx() {
  const used = new Map();
  monthTx(S.month).forEach(t => { if (t.categoryId) used.set(t.categoryId, catInfo(t).name); });
  let list = monthTx(S.month);
  if (S.filter !== 'all') list = list.filter(t => t.categoryId === S.filter);
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const {inc, exp} = sums(list);
  const chips = `<div class="chips"><button class="chip ${S.filter === 'all' ? 'on' : ''}" data-a="filter:all">הכול</button>${[...used].map(([id, name]) =>
    `<button class="chip ${S.filter === id ? 'on' : ''}" data-a="filter:${esc(id)}">${esc(name)}</button>`).join('')}</div>`;
  let body = '', lastDay = '';
  for (const t of list) {
    if (t.date !== lastDay) { body += `<div class="day">${dayLabel(t.date)}</div>`; lastDay = t.date; }
    const ci = catInfo(t);
    body += `<button class="tx" data-a="tx:${esc(t.id)}"><i class="dot" style="background:${ci.color}"></i>
      <div class="tx-m"><b>${esc(ci.name)}</b>${t.note ? `<small>${esc(t.note)}</small>` : ''}</div>
      <div class="tx-a ${t.type === 'income' ? 'pos' : ''}">${t.type === 'income' ? num(t.amount, {sign:true, exact:true}) : num(-t.amount, {exact:true})}</div></button>`;
  }
  if (!list.length) body = '<div class="empty" style="padding:30px 20px;text-align:center">אין תנועות להצגה</div>';
  return `<div class="tx-head"><div class="sec-h" style="margin:0"><h2 style="margin:0;font-size:22px;font-weight:500">תנועות</h2>${monthSwitch()}</div></div>${chips}
    <div class="sum-line">${list.length} תנועות, הוצאות ${num(exp, {exact:true})}${inc ? `, הכנסות ${num(inc, {exact:true})}` : ''}</div>${body}`;
}

function viewNet() {
  const snaps = snapsAsc(), last = snaps.at(-1);
  if (!last) return `<section class="net-top"><h2 style="margin:0;font-size:22px;font-weight:500">שווי נקי</h2></section>
    <section class="sec" style="border:0"><p class="muted">עדיין אין עדכונים. הזינו את הסכומים הנוכחיים כדי לקבל נקודת התחלה.</p><button class="btn primary" data-a="net">עדכון ראשון</button></section>`;
  chartData.net = snaps.map(s => ({date: s.date, v: s.net}));
  const val = id => last.values?.[id] || 0;
  const share = (v, tot) => tot > 0 ? `${Math.round(v / tot * 100)}%` : '';
  const rowsOf = (items, tot) => items.map(it => `<div class="row"><div class="grow">${esc(it.name)}</div><div class="muted" style="font-size:13px">${share(val(it.id), tot)}</div><b style="font-weight:500;min-width:92px;text-align:end">${num(val(it.id))}</b></div>`).join('');
  const hist = [...snaps].reverse().map((s, i, arr) => {
    const p = arr[i + 1]; const d = p ? s.net - p.net : null;
    return `<button class="row" data-a="snap:${esc(s.id)}"><div class="grow">${shortDate(s.date)}${d !== null ? `<small class="${d >= 0 ? 'pos' : 'neg'}">${num(d, {sign:true})}</small>` : ''}</div><b style="font-weight:500">${num(s.net)}</b>${ICON.chev}</button>`;
  }).join('');
  return `<section class="net-top"><div class="hero-top"><span class="lbl">שווי נקי</span><span id="netDate"></span></div>
    <div class="big" id="netVal">${num(last.net)}</div><div class="read" id="netRead"></div>
    <div class="chart" data-chart="net" data-h="190" data-inter="1" style="margin:10px -20px 0"></div></section>
    <section class="sec"><div class="sub"><b>נכסים</b><b>${num(last.assets)}</b></div>${rowsOf(S.settings.assets, last.assets)}</section>
    <section class="sec"><div class="sub"><b>התחייבויות</b><b>${num(last.liabilities)}</b></div>${rowsOf(S.settings.liabilities, last.liabilities)}</section>
    <section class="sec"><div class="sec-h"><h2>היסטוריית עדכונים</h2></div>${hist}</section>`;
}

function viewSettings() {
  const catRows = type => S.settings.categories.filter(c => c.type === type).map(c =>
    `<button class="row" data-a="item:${type}:${esc(c.id)}"><i class="dot" style="background:${c.color}"></i><div class="grow">${esc(c.name)}</div>${ICON.chev}</button>`).join('');
  const itemRows = kind => S.settings[kind === 'asset' ? 'assets' : 'liabilities'].map(c =>
    `<button class="row" data-a="item:${kind}:${esc(c.id)}"><div class="grow">${esc(c.name)}</div>${ICON.chev}</button>`).join('');
  const acct = MODE === 'fb'
    ? `<div class="row"><div class="grow">${esc(S.user?.email || '')}<small>מסונכרן לחשבון</small></div></div><button class="btn block danger" data-a="signout" style="margin-top:8px">יציאה מהחשבון</button>`
    : `<div class="note">האפליקציה במצב מקומי: הנתונים נשמרים רק בדפדפן הזה. כדי לסנכרן בין מכשירים, הדביקו את פרטי Firebase בראש הקובץ (ראו README).</div>`;
  return `<div class="set-h">הגדרות</div>
    <section class="sec" style="border:0"><div class="sec-h"><h2>חשבון</h2></div>${acct}</section>
    <section class="sec"><div class="sec-h"><h2>קטגוריות הוצאה</h2></div>${catRows('expense')}<button class="btn link addrow" data-a="newitem:expense">הוספת קטגוריה</button></section>
    <section class="sec"><div class="sec-h"><h2>קטגוריות הכנסה</h2></div>${catRows('income')}<button class="btn link addrow" data-a="newitem:income">הוספת קטגוריה</button></section>
    <section class="sec"><div class="sec-h"><h2>נכסים</h2></div>${itemRows('asset')}<button class="btn link addrow" data-a="newitem:asset">הוספת נכס</button></section>
    <section class="sec"><div class="sec-h"><h2>התחייבויות</h2></div>${itemRows('liab')}<button class="btn link addrow" data-a="newitem:liab">הוספת התחייבות</button></section>
    <section class="sec"><div class="sec-h"><h2>גיבוי</h2></div>
      <p class="muted" style="margin-top:0">קובץ JSON עם כל התנועות, העדכונים וההגדרות. כדאי לשמור עותק מדי פעם ב־iCloud.</p>
      <div style="display:flex;gap:10px"><button class="btn" data-a="export" style="flex:1">ייצוא</button><button class="btn" data-a="import" style="flex:1">ייבוא</button></div></section>`;
}

/* ---------- רינדור ---------- */
function render() {
  if (MODE === 'fb' && !S.user) return;
  const app = $('#app');
  if (!S.settings) { app.innerHTML = '<div class="loading">טוען…</div>'; return; }
  const y = window.scrollY;
  app.innerHTML = ({home: viewHome, tx: viewTx, net: viewNet, set: viewSettings}[S.tab])();
  $('#tabs').classList.remove('hidden');
  $('#tabs div').innerHTML = [['home','בית','home'],['tx','תנועות','list'],['net','שווי נקי','trend'],['set','הגדרות','gear']].map(([k, l, i]) =>
    `<button class="tab ${S.tab === k ? 'on' : ''}" data-a="tab:${k}">${ICON[i]}<span>${l}</span></button>`).join('');
  const fab = $('#fab');
  if (S.tab === 'set') fab.classList.add('hidden');
  else { fab.classList.remove('hidden'); fab.innerHTML = S.tab === 'net' ? 'עדכון שווי' : `${ICON.plus}<span>הוספה</span>`; }
  drawCharts();
  window.scrollTo(0, y);
}

/* ---------- גרפים ---------- */
function drawCharts() {
  document.querySelectorAll('.chart[data-chart]').forEach(el => {
    const pts = chartData[el.dataset.chart]; if (!pts?.length) return;
    drawChart(el, pts);
  });
}
function drawChart(el, pts) {
  const w = el.clientWidth || 360, inter = el.dataset.inter === '1';
  const h = (+el.dataset.h || 110) - (inter ? 24 : 0);
  const padL = inter ? 20 : 0, padR = inter ? 20 : 12, padT = 14, padB = 10;
  const xs = pts.map(p => Date.parse(p.date + 'T00:00:00Z')), vs = pts.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi === lo) { hi += 1; lo -= 1; }
  const span = hi - lo; lo -= span * .12; hi += span * .12;
  const X = t => pts.length === 1 || x1 === x0 ? w - padR : padL + (t - x0) / (x1 - x0) * (w - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)} ${Y(vs[i]).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `${line}L${X(xs.at(-1)).toFixed(1)} ${h}L${X(xs[0]).toFixed(1)} ${h}Z` : '';
  const dots = inter && pts.length <= 40 ? pts.map((p, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(vs[i]).toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.8"/>`).join('') : '';
  const lx = X(xs.at(-1)), ly = Y(vs.at(-1));
  const axis = inter ? `<div class="axis"><span>${shortDate(pts[0].date)}</span>${pts.length > 1 ? `<span>${shortDate(pts.at(-1).date)}</span>` : ''}</div>` : '';
  el.innerHTML = `<svg dir="ltr" viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="גרף שווי נקי לאורך זמן">
    ${area ? `<path d="${area}" fill="var(--accent)" opacity=".1"/>` : ''}
    ${pts.length > 1 ? `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${dots}
    <circle class="end" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="var(--accent)"/>
    <circle class="mk" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5" style="display:none"/></svg>${axis}`;
  if (!inter) return;
  const svg = el.querySelector('svg'), mk = svg.querySelector('.mk');
  const show = i => {
    if (i === null) { mk.style.display = 'none'; i = pts.length - 1; }
    else { mk.style.display = ''; mk.setAttribute('cx', X(xs[i])); mk.setAttribute('cy', Y(vs[i])); }
    const p = pts[i], prev = pts[i - 1];
    $('#netVal').innerHTML = num(p.v);
    $('#netDate').textContent = shortDate(p.date);
    $('#netRead').innerHTML = prev ? `${num(p.v - prev.v, {sign:true})} מהעדכון הקודם` : 'עדכון ראשון';
  };
  const near = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width);
    let bi = 0, bd = 1e9; xs.forEach((t, i) => { const d = Math.abs(X(t) - px); if (d < bd) { bd = d; bi = i; } });
    return bi;
  };
  svg.addEventListener('pointerdown', e => show(near(e)));
  svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') show(near(e)); });
  svg.addEventListener('pointerleave', () => show(null));
  svg.addEventListener('pointerup', e => { if (e.pointerType === 'touch') setTimeout(() => show(null), 1800); });
  show(null);
}

/* ---------- חלון תחתון ---------- */
function openSheet(inner) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="backdrop" data-a="close"></div><div class="panel" role="dialog" aria-modal="true">${inner}</div>`;
  sh.classList.add('open'); document.body.style.overflow = 'hidden';
  return sh.querySelector('.panel');
}
function closeSheet() { const sh = $('#sheet'); sh.classList.remove('open'); sh.innerHTML = ''; document.body.style.overflow = ''; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

function openTxSheet(existing) {
  const lastCat = ty => { try { return localStorage.getItem('lastcat-' + ty); } catch (e) { return null; } };
  let type = existing ? existing.type : 'expense';
  let catId = existing ? existing.categoryId : lastCat(type);
  const cats = () => S.settings.categories.filter(c => c.type === type);
  const p = openSheet(`<h3>${existing ? 'עריכת תנועה' : 'תנועה חדשה'}</h3>
    <div class="seg"><button data-t="expense">הוצאה</button><button data-t="income">הכנסה</button></div>
    <div class="amt"><span>₪</span><input id="amt" inputmode="decimal" placeholder="0" autocomplete="off" value="${existing ? existing.amount : ''}"></div>
    <div class="pick" id="pick"></div>
    <div class="two"><label class="field"><span>תאריך</span><input class="inp" type="date" id="dt" value="${existing ? existing.date : todayStr()}"></label>
    <label class="field"><span>הערה</span><input class="inp" id="nt" maxlength="80" placeholder="אופציונלי" value="${esc(existing?.note || '')}"></label></div>
    <p class="err" id="err"></p>
    <div class="actions">${existing ? '<button class="btn danger" id="del">מחיקה</button>' : ''}<button class="btn primary" id="save">שמירה</button></div>`);
  const paint = () => {
    p.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t === type));
    if (!cats().some(c => c.id === catId)) catId = cats()[0]?.id || null;
    $('#pick').innerHTML = cats().map(c => `<button class="chip ${c.id === catId ? 'on' : ''}" data-c="${esc(c.id)}" style="${c.id === catId ? 'background:' + c.color : ''}">${esc(c.name)}</button>`).join('')
      || '<span class="muted">אין קטגוריות. אפשר להוסיף בהגדרות.</span>';
  };
  p.querySelectorAll('.seg button').forEach(b => b.onclick = () => { type = b.dataset.t; catId = lastCat(type); paint(); });
  $('#pick').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { catId = b.dataset.c; paint(); } };
  paint();
  if (!existing) setTimeout(() => $('#amt').focus(), 60);
  $('#save').onclick = () => {
    const amount = parseAmount($('#amt').value);
    if (!(amount > 0)) { $('#err').textContent = 'יש להזין סכום גדול מאפס'; $('#amt').focus(); return; }
    const cat = catById(catId);
    const t = {id: existing?.id || newId(), type, amount, categoryId: cat?.id || '', categoryName: cat?.name || '',
      date: $('#dt').value || todayStr(), note: $('#nt').value.trim(), createdAt: existing?.createdAt || Date.now()};
    DB.putTx(t);
    try { localStorage.setItem('lastcat-' + type, t.categoryId); } catch (e) {}
    closeSheet(); toast('נשמר');
  };
  if (existing) $('#del').onclick = () => { if (confirm('למחוק את התנועה?')) { DB.delTx(existing.id); closeSheet(); toast('נמחק'); } };
}

function openNetSheet(existing) {
  const base = existing || snapsAsc().at(-1);
  const vals = base?.values || {};
  const st = S.settings;
  const row = (it, kind) => `<label class="frow"><span>${esc(it.name)}</span><input data-k="${esc(it.id)}" data-kind="${kind}" inputmode="decimal" placeholder="0" value="${vals[it.id] ? vals[it.id] : ''}"></label>`;
  const p = openSheet(`<h3>${existing ? 'עריכת עדכון' : 'עדכון שווי נקי'}</h3>
    <label class="field"><span>תאריך</span><input class="inp" type="date" id="nd" value="${existing ? existing.date : todayStr()}"></label>
    <div class="fgroup">נכסים</div>${st.assets.map(a => row(a, 'a')).join('')}
    <div class="fgroup">התחייבויות</div>${st.liabilities.map(a => row(a, 'l')).join('')}
    <div class="tot"><span>שווי נקי</span><span id="ntot"></span></div>
    <p class="err" id="err"></p>
    <div class="actions">${existing ? '<button class="btn danger" id="del">מחיקה</button>' : ''}<button class="btn primary" id="save">שמירה</button></div>`);
  const calc = () => {
    let a = 0, l = 0; const v = {};
    p.querySelectorAll('input[data-k]').forEach(i => { const x = parseAmount(i.value) || 0; v[i.dataset.k] = x; if (i.dataset.kind === 'a') a += x; else l += x; });
    return {v, a, l, n: a - l};
  };
  const upd = () => { $('#ntot').innerHTML = num(calc().n); };
  p.addEventListener('input', upd); upd();
  $('#save').onclick = () => {
    const c = calc(), date = $('#nd').value || todayStr();
    const labels = {}; [...st.assets, ...st.liabilities].forEach(i => labels[i.id] = i.name);
    const snap = {id: date, date, values: c.v, labels, assets: c.a, liabilities: c.l, net: c.n, updatedAt: Date.now()};
    if (existing && existing.id !== date) DB.delSnap(existing.id);
    DB.putSnap(snap); closeSheet(); toast('העדכון נשמר');
  };
  if (existing) $('#del').onclick = () => { if (confirm('למחוק את העדכון הזה?')) { DB.delSnap(existing.id); closeSheet(); toast('נמחק'); } };
}

function openItemSheet(kind, id) {
  const isCat = kind === 'expense' || kind === 'income';
  const key = isCat ? 'categories' : (kind === 'asset' ? 'assets' : 'liabilities');
  const existing = id ? S.settings[key].find(x => x.id === id) : null;
  let color = existing?.color || PALETTE[Math.floor(Math.random() * PALETTE.length)];
  const titles = {expense:'קטגוריית הוצאה', income:'קטגוריית הכנסה', asset:'נכס', liab:'התחייבות'};
  const p = openSheet(`<h3>${existing ? 'עריכת' : 'הוספת'} ${titles[kind]}</h3>
    <label class="field"><span>שם</span><input class="inp" id="nm" maxlength="40" value="${esc(existing?.name || '')}"></label>
    ${isCat ? '<div class="sw" id="sw"></div>' : ''}
    <p class="err" id="err"></p>
    <div class="actions">${existing ? '<button class="btn danger" id="del">מחיקה</button>' : ''}<button class="btn primary" id="save">שמירה</button></div>`);
  const paint = () => { if (isCat) $('#sw').innerHTML = PALETTE.map(c => `<button data-c="${c}" style="background:${c}" class="${c === color ? 'on' : ''}" aria-label="צבע"></button>`).join(''); };
  if (isCat) $('#sw').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { color = b.dataset.c; paint(); } };
  paint();
  $('#save').onclick = () => {
    const name = $('#nm').value.trim();
    if (!name) { $('#err').textContent = 'יש להזין שם'; return; }
    const s = structuredClone(S.settings);
    if (existing) {
      const o = s[key].find(x => x.id === id); o.name = name; if (isCat) o.color = color;
    } else {
      s[key].push(isCat ? {id: newId(), name, type: kind, color} : {id: newId(), name});
    }
    DB.putSettings(s); closeSheet(); toast('נשמר');
  };
  if (existing) $('#del').onclick = () => {
    const used = isCat ? S.tx.filter(t => t.categoryId === id).length : 0;
    const msg = used ? `לקטגוריה הזו יש ${used} תנועות. הן יישארו, אבל יוצגו בלי צבע. למחוק?` : 'למחוק?';
    if (!confirm(msg)) return;
    const s = structuredClone(S.settings); s[key] = s[key].filter(x => x.id !== id);
    DB.putSettings(s); closeSheet(); toast('נמחק');
  };
}

/* ---------- ייצוא וייבוא ---------- */
async function doExport() {
  const data = {app:'finance-dashboard', version:1, exportedAt:new Date().toISOString(), settings:S.settings, transactions:S.tx, snapshots:S.snaps};
  const name = `finance-backup-${todayStr()}.json`;
  const file = new File([JSON.stringify(data, null, 2)], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function sanitize(d) {
  if (!d || !Array.isArray(d.transactions) || !Array.isArray(d.snapshots)) throw new Error('bad');
  const tx = d.transactions.filter(t => t && typeof t.id === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && isFinite(t.amount) && (t.type === 'expense' || t.type === 'income'))
    .map(t => ({id:t.id, type:t.type, amount:+t.amount, categoryId:String(t.categoryId || ''), categoryName:String(t.categoryName || ''), date:t.date, note:String(t.note || ''), createdAt:+t.createdAt || Date.now()}));
  const sn = d.snapshots.filter(s => s && /^\d{4}-\d{2}-\d{2}$/.test(s.date) && isFinite(s.net))
    .map(s => ({id:s.date, date:s.date, values:s.values || {}, labels:s.labels || {}, assets:+s.assets || 0, liabilities:+s.liabilities || 0, net:+s.net, updatedAt:+s.updatedAt || Date.now()}));
  const st = d.settings && Array.isArray(d.settings.categories) && Array.isArray(d.settings.assets) && Array.isArray(d.settings.liabilities) ? d.settings : null;
  return {settings: st, transactions: tx, snapshots: sn};
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = sanitize(JSON.parse(await f.text()));
    if (!confirm(`לייבא ${d.transactions.length} תנועות ו־${d.snapshots.length} עדכוני שווי? פריטים עם אותו מזהה יתעדכנו.`)) return;
    await DB.importAll(d); toast('הייבוא הושלם');
  } catch (err) { console.error(err); alert('הקובץ לא תקין או שהייבוא נכשל'); }
});

/* ---------- אירועים ---------- */
const ACT = {
  tab: a => { S.tab = a; window.scrollTo(0, 0); render(); },
  month: a => { const n = shiftMonth(S.month, +a); if (n <= ymOf(todayStr())) { S.month = n; S.filter = 'all'; render(); } },
  fab: () => S.tab === 'net' ? openNetSheet() : openTxSheet(),
  tx: a => openTxSheet(S.tx.find(t => t.id === a)),
  net: () => openNetSheet(),
  snap: a => openNetSheet(S.snaps.find(s => s.id === a)),
  filter: a => { S.filter = a; render(); },
  cat: a => { S.filter = a || 'all'; S.tab = 'tx'; window.scrollTo(0, 0); render(); },
  item: a => { const [k, ...r] = a.split(':'); openItemSheet(k, r.join(':')); },
  newitem: a => openItemSheet(a),
  export: doExport,
  import: () => $('#file').click(),
  close: closeSheet,
  signout: async () => { if (confirm('לצאת מהחשבון?')) { FS.stop(); await FS.A.signOut(FS.auth); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const i = el.dataset.a.indexOf(':'); const name = i < 0 ? el.dataset.a : el.dataset.a.slice(0, i), arg = i < 0 ? '' : el.dataset.a.slice(i + 1);
  ACT[name]?.(arg, el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

/* ---------- כניסה ---------- */
const AUTH_ERR = {
  'auth/invalid-credential':'אימייל או סיסמה שגויים', 'auth/wrong-password':'אימייל או סיסמה שגויים', 'auth/user-not-found':'אימייל או סיסמה שגויים',
  'auth/email-already-in-use':'כבר קיים חשבון עם האימייל הזה', 'auth/weak-password':'הסיסמה חלשה מדי, צריך לפחות 6 תווים',
  'auth/invalid-email':'כתובת האימייל לא תקינה', 'auth/too-many-requests':'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות',
  'auth/network-request-failed':'אין חיבור לאינטרנט', 'auth/popup-closed-by-user':'', 'auth/cancelled-popup-request':'',
  'auth/unauthorized-domain':'הדומיין הזה לא מורשה ב־Firebase (ראו README, שלב 5)', 'auth/operation-not-allowed':'שיטת הכניסה הזו לא הופעלה ב־Firebase'
};
function showAuth(mode = 'in') {
  $('#app').classList.add('hidden'); $('#tabs').classList.add('hidden'); $('#fab').classList.add('hidden');
  const a = $('#auth'); a.classList.remove('hidden');
  const up = mode === 'up';
  a.innerHTML = `<h1>מעקב פיננסי</h1><p>${up ? 'יצירת חשבון חדש' : 'כניסה לחשבון'}</p>
    <input class="inp" id="em" type="email" inputmode="email" autocomplete="email" placeholder="אימייל" dir="ltr" style="text-align:right">
    <input class="inp" id="pw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" placeholder="סיסמה" dir="ltr" style="text-align:right">
    <p class="err" id="aerr"></p>
    <button class="btn primary block" id="go">${up ? 'יצירת חשבון' : 'כניסה'}</button>
    <div class="or">או</div>
    <button class="btn block" id="gg">המשך עם Google</button>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <button class="btn link" id="sw">${up ? 'כבר יש לי חשבון' : 'יצירת חשבון חדש'}</button>
      ${up ? '' : '<button class="btn link" id="fp">שכחתי סיסמה</button>'}</div>`;
  const say = e => { $('#aerr').textContent = AUTH_ERR[e.code] ?? 'משהו השתבש, נסו שוב'; };
  const A = FS.A;
  $('#go').onclick = async () => {
    const em = $('#em').value.trim(), pw = $('#pw').value; $('#aerr').textContent = '';
    if (!em || !pw) { $('#aerr').textContent = 'יש למלא אימייל וסיסמה'; return; }
    try { await (up ? A.createUserWithEmailAndPassword : A.signInWithEmailAndPassword)(FS.auth, em, pw); } catch (e) { say(e); }
  };
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
  $('#gg').onclick = async () => {
    try { await A.signInWithPopup(FS.auth, new A.GoogleAuthProvider()); }
    catch (e) { if (e.code === 'auth/popup-blocked') { try { await A.signInWithRedirect(FS.auth, new A.GoogleAuthProvider()); } catch (x) { say(x); } } else say(e); }
  };
  $('#sw').onclick = () => showAuth(up ? 'in' : 'up');
  if (!up) $('#fp').onclick = async () => {
    const em = $('#em').value.trim(); if (!em) { $('#aerr').textContent = 'הזינו אימייל ואז לחצו שוב'; return; }
    try { await A.sendPasswordResetEmail(FS.auth, em); $('#aerr').style.color = 'var(--pos)'; $('#aerr').textContent = 'נשלח קישור לאיפוס סיסמה'; } catch (e) { say(e); }
  };
}

/* ---------- הפעלה ---------- */
async function boot() {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (MODE === 'local') { DB = Local; DB.start(); render(); return; }
  try { await FS.init(); }
  catch (e) { console.error(e); $('#app').innerHTML = '<div class="loading">לא ניתן לטעון את Firebase. בדקו את החיבור לאינטרנט ורעננו.</div>'; return; }
  DB = FS;
  FS.onAuth(user => {
    if (user) {
      S.user = user; $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
      S.settings = null; render(); FS.start(user);
    } else {
      FS.stop(); S.user = null; S.settings = null; S.tx = []; S.snaps = []; showAuth();
    }
  });
}
boot();
</script>
