  if(!t)focusEl(amt);
}
function syncTxType(){
  const v=S.form.type;
  $$('#f-type button').forEach(b=>{b.className=b.dataset.v===v?'on '+(v==='expense'?'exp':'inc'):'';});
  const w=$('#f-amount-wrap');if(w)w.className='amount-wrap '+(v==='expense'?'exp':'inc');
}
function renderCatChips(){
  const f=S.form,box=$('#f-cats');if(!box||!f)return;
  const counts=usageCounts();
  const cats=S.tx.categories.map((c,i)=>({c,i})).filter(o=>o.c.type===f.type)
    .sort((a,b)=>(counts[b.c.id]||0)-(counts[a.c.id]||0)||a.i-b.i).map(o=>o.c);
  box.innerHTML=(cats.length?'':'<span class="muted small" style="align-self:center">עוד אין קטגוריות מסוג זה.</span>')+
    cats.map(c=>'<button class="chip '+(f.categoryId===c.id?'on':'')+'" style="--c:'+c.color+'" data-a="f-cat" data-id="'+esc(c.id)+'">'+esc(c.icon)+' '+esc(c.name)+'</button>').join('')+
    '<button class="chip add" data-a="f-newcat">＋ חדשה</button>';
}
function syncDateChips(){
  const d=S.form.date;
  $$('#f-datechips .chip').forEach(b=>b.classList.toggle('on',(b.dataset.v==='t'&&d===todayStr())||(b.dataset.v==='y'&&d===yesterdayStr())));
}
function addInlineCat(){
  const f=S.form;if(!f)return;
  const name=$('#f-newcat-name').value.trim();
  if(!name){toast('צריך שם לקטגוריה');focusEl($('#f-newcat-name'));return;}
  const c={id:uid(),name,icon:firstGlyph($('#f-newcat-icon').value)||'🏷️',type:f.type,color:PALETTE[S.tx.categories.length%PALETTE.length],ord:Date.now()};
  S.tx.categories.push(c);f.categoryId=c.id;
  D.putCat(c);
  $('#f-newcat').hidden=true;$('#f-newcat-name').value='';
  renderCatChips();toast('הקטגוריה נוספה');
}
function saveTx(){
  const f=S.form;if(!f)return;
  const amount=parseAmount($('#f-amount').value);
  if(!(amount>0)){toast('צריך סכום גדול מאפס');focusEl($('#f-amount'));return;}
  if(!f.categoryId){toast('צריך לבחור קטגוריה');return;}
  const date=/^\d{4}-\d{2}-\d{2}$/.test($('#f-date').value)?$('#f-date').value:todayStr();
  const note=$('#f-note').value.trim();
  const catName=catView(f.categoryId).name;
  const mk=date.slice(0,7),active=wantedMonths().has(mk);
  let t;
  if(f.id){
    t=S.tx.transactions.find(x=>x.id===f.id);
    if(!t)return;
    Object.assign(t,{type:f.type,amount,categoryId:f.categoryId,catName,date,note});
  }else{
    t={id:uid(),type:f.type,amount,categoryId:f.categoryId,catName,date,note,createdAt:Date.now()};
    if(active)S.tx.transactions.push(t);
  }
  const edited=!!f.id;
  D.putTx(t);closeSheet();render();
  toast(!active?'נשמר ב'+monthName(mk):edited?'השינויים נשמרו':(f.type==='income'?'ההכנסה נשמרה':'ההוצאה נשמרה'));
}

/* ================= sheets: assets & liabilities ================= */
function openNwSheet(kind,id){
  const list=kind==='asset'?S.nw.assets:S.nw.liabilities,cats=kind==='asset'?ASSET_CATS:LIAB_CATS;
  const x=id?list.find(i=>i.id===id):null;
  if(id&&!x)return;
  S.form={kind:'nw',nk:kind,id:x?x.id:null,category:x?x.category:cats[0].id};
  const title=x?(kind==='asset'?'עדכון נכס':'עדכון התחייבות'):(kind==='asset'?'נכס חדש':'התחייבות חדשה');
  const html=sheetHead(title)+
    '<div class="field-label" style="margin-top:4px">'+(kind==='asset'?'שווי נוכחי':'יתרה לסילוק')+'</div>'+
    '<label class="amount-wrap"><span class="cur">₪</span><input id="n-value" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0" value="'+(x?x.value:'')+'"></label>'+
    (x?'<p class="hint" style="text-align:center">עודכן '+relDay(x.updatedAt)+'. שמירה של סכום חדש מוסיפה נקודה לגרף.</p>':'')+
    '<div class="field-label">סוג</div><div class="chips wrap" id="n-cats">'+cats.map(c=>
      '<button class="chip '+(c.id===S.form.category?'on':'')+'" style="--c:'+c.color+'" data-a="f-acat" data-v="'+c.id+'">'+c.icon+' '+c.name+'</button>').join('')+'</div>'+
    '<div class="field-label">שם</div><input id="n-name" class="input" enterkeyhint="done" placeholder="'+(kind==='asset'?'למשל: גמל להשקעה, מסלול מניות':'למשל: משכנתא, מסלול פריים')+'" value="'+esc(x?x.name:'')+'">'+
    '<div class="sheet-actions">'+(x?'<button class="btn ghost danger" data-a="nw-del">מחיקה</button>':'')+'<button class="btn primary grow" data-a="nw-save" data-primary>'+(x?'שמירת עדכון':'הוספה')+'</button></div>';
  openSheet(html);
  const v=$('#n-value');sizeAmount(v);focusEl(v,!!x);
}
function saveNw(){
  const f=S.form;if(!f)return;
  const list=f.nk==='asset'?S.nw.assets:S.nw.liabilities,cats=f.nk==='asset'?ASSET_CATS:LIAB_CATS;
  const raw=$('#n-value').value,value=parseAmount(raw);
  if(!raw.trim()||!(value>=0)){toast('צריך סכום תקין');focusEl($('#n-value'));return;}
  const name=$('#n-name').value.trim()||cats.find(c=>c.id===f.category).name;
  const now=Date.now();
  let item;
  if(f.id){
    item=list.find(i=>i.id===f.id);if(!item)return;
    Object.assign(item,{name,category:f.category,value,updatedAt:now});
  }else{
    item={id:uid(),name,category:f.category,value,updatedAt:now};
    list.push(item);
  }
  const pt=snapshot((f.id?'עדכון: ':'הוספה: ')+name);
  const edited=!!f.id,nk=f.nk;
  D.putItem(nk,item,pt);closeSheet();render();
  toast(edited?(pt?'העדכון נשמר ונוסף לגרף':'העדכון נשמר'):(nk==='asset'?'הנכס נוסף':'ההתחייבות נוספה'));
}

/* ================= sheets: categories ================= */
function saveCat(){
  const f=S.form;if(!f)return;
  const name=$('#c-name').value.trim();
  if(!name){toast('צריך שם לקטגוריה');focusEl($('#c-name'));return;}
  const icon=firstGlyph($('#c-icon').value)||'🏷️';
  let c;
  if(f.id){
    c=S.tx.categories.find(x=>x.id===f.id);
    if(!c)return;
    Object.assign(c,{name,icon,color:f.color,type:catLocked(f)?c.type:f.type});
  }else{
    c={id:uid(),name,icon,type:f.type,color:f.color,ord:Date.now()};
    S.tx.categories.push(c);
    S.catTab=f.type;
  }
  const edited=!!f.id;
  D.putCat(c);closeSheet();render();toast(edited?'הקטגוריה עודכנה':'הקטגוריה נוספה');
}

/* ================= sheet: עדכון מלא ================= */
function bulkRow(kind,x,c){
  return '<label class="bulk-row"><span class="ic sm" style="--c:'+c.color+'">'+c.icon+'</span><span class="bulk-name">'+esc(x.name)+'</span>'+
    '<input class="bulk-in" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-kind="'+kind+'" data-id="'+esc(x.id)+'" value="'+x.value+'" aria-label="'+esc(x.name)+'"></label>';
}
function bulkRows(kind,list,cats){
  let h='';
  for(const c of cats){
    list.filter(x=>x.category===c.id).sort((a,b)=>b.value-a.value).forEach(x=>{h+=bulkRow(kind,x,c);});
  }
  return h;
}
function bulkTotal(){
  const el=$('#b-total');if(!el)return;
  let a=0,l=0;
  $$('#sheet .bulk-in').forEach(inp=>{
    const kind=inp.dataset.kind,list=kind==='asset'?S.nw.assets:S.nw.liabilities,x=list.find(i=>i.id===inp.dataset.id);
    let v=x?x.value:0;
    const raw=inp.value.trim();
    if(raw!==''){const p=parseAmount(raw);if(p>=0)v=p;}
    if(kind==='asset')a+=v;else l+=v;
  });
  el.innerHTML=money(r2(a-l));
}
function openBulkSheet(){
  if(!S.nw.assets.length&&!S.nw.liabilities.length){toast('אין עדיין נכסים לעדכון');return;}
  S.form={kind:'bulk'};
  let h=sheetHead('עדכון מלא')+
    '<p class="hint" style="margin-top:0">עוברים על הסכומים ומעדכנים מה שהשתנה. השמירה מסמנת את כל הפריטים כמעודכנים ומוסיפה נקודה אחת לגרף.</p>';
  if(S.nw.assets.length)h+='<div class="field-label">נכסים</div>'+bulkRows('asset',S.nw.assets,ASSET_CATS);
  if(S.nw.liabilities.length)h+='<div class="field-label">התחייבויות</div>'+bulkRows('liab',S.nw.liabilities,LIAB_CATS);
  h+='<div class="bulk-total"><span>שווי נקי</span><b id="b-total"></b></div>'+
    '<div class="sheet-actions"><button class="btn primary grow" data-a="bulk-save" data-primary>שמירת עדכון</button></div>';
  openSheet(h);
  bulkTotal();
}
function saveBulk(){
  const f=S.form;if(!f||f.kind!=='bulk')return;
  const now=Date.now(),changes=[];
  for(const el of $$('#sheet .bulk-in')){
    const raw=el.value.trim(),kind=el.dataset.kind;
    const list=kind==='asset'?S.nw.assets:S.nw.liabilities;
    const x=list.find(i=>i.id===el.dataset.id);if(!x)continue;
    let v=x.value;
    if(raw!==''){
      v=parseAmount(raw);
      if(!(v>=0)){toast('סכום לא תקין ב"'+x.name+'"','err');focusEl(el,true);return;}
    }
    changes.push({kind,x,v});
  }
  if(!changes.length){closeSheet();return;}
  const ups=changes.map(({kind,x,v})=>{x.value=v;x.updatedAt=now;return{kind,id:x.id,value:v,updatedAt:now};});
  const pt=snapshot('עדכון מלא');
  D.bulk(ups,pt);closeSheet();render();
  toast(pt?'העדכון נשמר ונוסף לגרף':'העדכון נשמר');
}

/* ================= sheet: קטגוריה (עם ספירת שימוש מהשרת) ================= */
function localCatUse(id){let n=0;for(const t of S.tx.transactions)if(t.categoryId===id)n++;return n;}
function catLocked(f){return !!f.id&&!(f.usedKnown&&f.used===0);}
function openCatSheet(id){
  const c=id?S.tx.categories.find(x=>x.id===id):null;
  if(id&&!c)return;
  const f=S.form={kind:'cat',id:c?c.id:null,type:c?c.type:S.catTab,color:c?c.color:PALETTE[S.tx.categories.length%PALETTE.length],
    used:c?localCatUse(c.id):0,usedKnown:false,countFailed:false};
  const html=sheetHead(c?'עריכת קטגוריה':'קטגוריה חדשה')+
    '<div class="row" style="gap:8px;margin-top:6px"><input id="c-icon" class="input emoji-in" maxlength="8" aria-label="אייקון" value="'+esc(c?c.icon:'🏷️')+'"><input id="c-name" class="input grow" enterkeyhint="done" placeholder="שם הקטגוריה" value="'+esc(c?c.name:'')+'"></div>'+
    '<div class="emoji-pick">'+EMOJIS.map(e=>'<button data-a="f-emoji" data-v="'+e+'" aria-label="בחירת אייקון">'+e+'</button>').join('')+'</div>'+
    '<div class="field-label">סוג</div><div class="seg" id="c-type"><button data-a="f-ctype" data-v="expense">הוצאה</button><button data-a="f-ctype" data-v="income">הכנסה</button></div>'+
    '<p class="hint" id="c-used-hint"></p>'+
    '<div class="field-label">צבע</div><div class="swatches">'+PALETTE.map(p=>'<button class="sw" style="--c:'+p+'" data-a="f-color" data-v="'+p+'" aria-label="צבע"></button>').join('')+'</div>'+
    '<div class="sheet-actions">'+(c?'<button class="btn ghost danger" data-a="cat-del">מחיקה</button>':'')+'<button class="btn primary grow" data-a="cat-save" data-primary>'+(c?'שמירת שינויים':'הוספת קטגוריה')+'</button></div>';
  openSheet(html);
  syncCatForm();
  if(c){
    D.countCat(c.id).then(n=>{if(S.form!==f)return;f.used=n;f.usedKnown=true;syncCatForm();})
      .catch(()=>{if(S.form!==f)return;f.countFailed=true;syncCatForm();});
  }else focusEl($('#c-name'));
}
function syncCatForm(){
  const f=S.form;if(!f||f.kind!=='cat')return;
  $$('#c-type button').forEach(b=>{b.className=b.dataset.v===f.type?'on '+(f.type==='expense'?'exp':'inc'):'';});
  const seg=$('#c-type');if(seg)seg.classList.toggle('locked',catLocked(f));
  const h=$('#c-used-hint');
  if(h){
    h.textContent=!f.id?'':f.usedKnown?(f.used?'יש '+f.used+' תנועות בקטגוריה, ולכן אי אפשר לשנות את הסוג שלה.':''):(f.countFailed?'אין חיבור, ולכן אי אפשר לשנות את הסוג כרגע.':'בודק שימוש בקטגוריה…');
    h.style.display=h.textContent?'':'none';
  }
  $$('#sheet .sw').forEach(b=>b.classList.toggle('on',b.dataset.v===f.color));
}

/* ================= sheet: סטטיסטיקות ================= */
async function openStatsSheet(){
  const f=S.form={kind:'stats'};
  openSheet(sheetHead('סטטיסטיקות')+'<div id="st-body"><div class="skel" style="height:150px"></div></div>');
  try{
    const r=await D.stats(S.tx.categories);
    if(S.form!==f)return;
    const row=c=>'<div class="tx-row" style="cursor:default"><span class="ic sm" style="--c:'+c.color+'">'+esc(c.icon)+'</span><span class="tx-main"><span class="tx-title">'+esc(c.name)+'</span></span><b class="num">'+F.n0.format(r.byCat[c.id]||0)+'</b></div>';
    const grp=(title,type)=>{
      const list=S.tx.categories.filter(c=>c.type===type).sort((a,b)=>(r.byCat[b.id]||0)-(r.byCat[a.id]||0));
      return list.length?'<div class="grp-h"><span>'+title+'</span></div>'+list.map(row).join(''):'';
    };
    const known=S.tx.categories.reduce((s,c)=>s+(r.byCat[c.id]||0),0),rest=Math.max(0,r.total-known);
    $('#st-body').innerHTML='<div class="row between" style="padding:6px 2px 2px"><span class="muted">סה"כ תנועות</span><b class="num" style="font-size:20px">'+F.n0.format(r.total)+'</b></div>'+
      '<div class="surface" style="margin-top:8px;padding:2px 14px">'+grp('הוצאות','expense')+grp('הכנסות','income')+
      (rest?'<div class="grp-h"><span>אחר</span></div><div class="tx-row" style="cursor:default"><span class="ic sm" style="--c:#7C8580">❔</span><span class="tx-main"><span class="tx-title">ללא קטגוריה</span></span><b class="num">'+F.n0.format(rest)+'</b></div>':'')+'</div>'+
      '<p class="hint">הספירה מתבצעת בשרת ולא מורידה את התנועות.</p>';
  }catch(e){
    console.error(e);
    if(S.form!==f)return;
    $('#st-body').innerHTML='<div class="empty">אי אפשר לחשב סטטיסטיקות בלי חיבור לאינטרנט.</div>';
  }
}

/* ================= backup ================= */
async function doExport(){
  toast('מכין גיבוי…');
  let all;
  try{all=await D.allTx();}catch(e){console.error(e);toast('אין חיבור, אי אפשר לייצא גיבוי כרגע','err');return;}
  const data={app:'personal-finance-dashboard',version:2,exportedAt:new Date().toISOString(),tx:{categories:S.tx.categories,transactions:all},nw:S.nw};
  const name='finance-backup-'+todayStr()+'.json';
  const file=new File([JSON.stringify(data,null,2)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function importFile(file){
  let obj;
  try{obj=JSON.parse(await file.text());}catch(e){toast('הקובץ אינו גיבוי תקין','err');return;}
  if(!obj||typeof obj!=='object'||!obj.tx||!obj.nw){toast('הקובץ אינו גיבוי של הדשבורד','err');return;}
  const tx=normTx(obj.tx),nw=normNw(obj.nw);
  const msg='לייבא '+tx.transactions.length+' תנועות, '+tx.categories.length+' קטגוריות, '+(nw.assets.length+nw.liabilities.length)+' נכסים והתחייבויות ו־'+nw.history.length+' נקודות בגרף? פריטים עם אותו מזהה יתעדכנו, והשאר יישארו כמו שהם.';
  if(!await askConfirm(msg,{ok:'ייבוא'}))return;
  try{await D.importAll(tx,nw);toast('הייבוא הושלם');}catch(e){D.fail(e);}
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
  if(e.target.id==='overlay'){closeSheet();return;}
  const b=e.target.closest('[data-a]');
  if(!b||b.closest('#dialog'))return;
  const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id,f=S.form;
  switch(a){
    case 'nav':S.view=v;render();window.scrollTo(0,0);break;
    case 'fab':openTxSheet();break;
    case 'go':
      if(S.view!=='tx')S.month=monthKey(new Date());
      if(b.dataset.cat!==undefined){S.txCat=b.dataset.cat||null;S.txType='all';}
      S.view=v;render();window.scrollTo(0,0);break;
    case 'month':S.month=v==='0'?monthKey(new Date()):shiftMonth(S.month,+v);render();break;
    case 'tx-type':S.txType=v;S.txCat=null;render();break;
    case 'tx-cat':S.txCat=(!id||S.txCat===id)?null:id;render();break;
    case 'tx-clear':S.txCat=null;S.txType='all';render();break;
    case 'tx-edit':openTxSheet(id);break;
    case 'range':S.range=v;render();break;
    case 'sheet-close':closeSheet();break;

    case 'f-type':if(f&&f.type!==v){f.type=v;f.categoryId=null;syncTxType();renderCatChips();}break;
    case 'f-cat':if(f){f.categoryId=id;renderCatChips();}break;
    case 'f-newcat':{const box=$('#f-newcat');box.hidden=!box.hidden;if(!box.hidden)focusEl($('#f-newcat-name'));break;}
    case 'f-newcat-save':addInlineCat();break;
    case 'f-date':if(f){f.date=v==='t'?todayStr():yesterdayStr();$('#f-date').value=f.date;syncDateChips();}break;
    case 'tx-save':saveTx();break;
    case 'tx-del':{
      if(!f||!f.id)break;
      if(!await askConfirm('למחוק את התנועה?',{ok:'מחיקה',danger:true}))break;
      S.tx.transactions=S.tx.transactions.filter(t=>t.id!==f.id);
      D.delTx(f.id);closeSheet();render();toast('התנועה נמחקה');break;
    }

    case 'asset-add':openNwSheet('asset');break;
    case 'liab-add':openNwSheet('liab');break;
    case 'asset-edit':openNwSheet('asset',id);break;
    case 'liab-edit':openNwSheet('liab',id);break;
    case 'f-acat':if(f){f.category=v;$$('#n-cats .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));}break;
    case 'nw-save':saveNw();break;
    case 'nw-bulk':openBulkSheet();break;
    case 'bulk-save':saveBulk();break;
    case 'nw-del':{
      if(!f||!f.id)break;
      const list=f.nk==='asset'?S.nw.assets:S.nw.liabilities,x=list.find(i=>i.id===f.id);if(!x)break;
      if(!await askConfirm('למחוק את "'+x.name+'"? השווי הנקי יתעדכן ותתווסף נקודה לגרף.',{ok:'מחיקה',danger:true}))break;
      const nk=f.nk;
      if(nk==='asset')S.nw.assets=S.nw.assets.filter(i=>i.id!==x.id);else S.nw.liabilities=S.nw.liabilities.filter(i=>i.id!==x.id);
      const pt=snapshot('מחיקה: '+x.name);
      D.delItem(nk,x.id,pt);closeSheet();render();toast('נמחק');break;
    }
    case 'hist-toggle':S.histOpen=!S.histOpen;render();break;
    case 'hist-del':{
      const ts=+id;
      if(!await askConfirm('למחוק את הנקודה מהגרף? הנכסים עצמם לא ישתנו.',{ok:'מחיקה',danger:true}))break;
      S.nw.history=S.nw.history.filter(p=>p.t!==ts);
      D.delHist(ts);render();break;
    }

    case 'cat-tab':S.catTab=v;render();break;
    case 'cat-add':openCatSheet();break;
    case 'cat-edit':openCatSheet(id);break;
    case 'f-emoji':{const i=$('#c-icon');if(i)i.value=v;break;}
    case 'f-ctype':if(f&&!catLocked(f)){f.type=v;syncCatForm();}break;
    case 'f-color':if(f){f.color=v;syncCatForm();}break;
    case 'cat-save':saveCat();break;
    case 'cat-del':{
      if(!f||!f.id)break;
      const msg=f.used?'יש '+f.used+' תנועות בקטגוריה. הן יישארו, ויסומנו "ללא קטגוריה" בסיכומים (בשורת התנועה יישאר שם הקטגוריה הישן). למחוק?'
        :f.usedKnown?'למחוק את הקטגוריה?'
        :'אי אפשר לבדוק כמה תנועות משויכות לקטגוריה (אין חיבור). הן יישארו ויסומנו "ללא קטגוריה". למחוק?';
      if(!await askConfirm(msg,{ok:'מחיקה',danger:true}))break;
      S.tx.categories=S.tx.categories.filter(c=>c.id!==f.id);
      if(S.txCat===f.id)S.txCat=null;
      D.delCat(f.id);closeSheet();render();toast('הקטגוריה נמחקה');break;
    }

    case 'bk':if(v==='export')doExport();else $('#file').click();break;
    case 'stats':openStatsSheet();break;
    case 'signout':{
      if(!await askConfirm('לצאת מהחשבון?',{ok:'יציאה'}))break;
      try{D.stop();await D.signOut();}catch(err){console.error(err);toast('היציאה נכשלה','err');}
      break;
    }
    case 'reset':{
      if(!await askConfirm('למחוק לצמיתות את כל התנועות, הקטגוריות, הנכסים וההיסטוריה? כדאי לייצא גיבוי קודם.',{ok:'מחיקת הכל',danger:true}))break;
      toast('מוחק…');
      let txIds;
      try{txIds=await D.txIds();}catch(err){console.error(err);toast('המחיקה דורשת חיבור לאינטרנט','err');break;}
      const old={cats:S.tx.categories.map(c=>c.id),txs:txIds,assets:S.nw.assets.map(x=>x.id),
        liabs:S.nw.liabilities.map(x=>x.id),hist:S.nw.history.map(p=>String(p.t))};
      const cats=defaultCats();
      S.tx={categories:cats,transactions:[]};S.nw={assets:[],liabilities:[],history:[]};
      S.txCat=null;
      D.wipe(old,cats);render();toast('כל הנתונים נמחקו');break;
    }
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='f-amount'||el.id==='n-value')sizeAmount(el);
  if(el.classList&&el.classList.contains('bulk-in'))bulkTotal();
});
document.addEventListener('focusin',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('bulk-in'))setTimeout(()=>{try{el.select();}catch(err){}},0);
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-date'&&S.form){S.form.date=e.target.value;syncDateChips();}
  if(e.target.id==='file'){const fl=e.target.files&&e.target.files[0];e.target.value='';if(fl)importFile(fl);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#dialog').classList.contains('open'))return;if($('#sheet').classList.contains('open'))closeSheet();return;}
  if(e.key==='Enter'&&e.target.matches('#sheet input:not([type=date])')){
    e.preventDefault();
    if(e.target.id==='f-newcat-name'){addInlineCat();return;}
    if(e.target.classList.contains('bulk-in')){
      const all=$$('#sheet .bulk-in'),i=all.indexOf(e.target);
      if(i>=0&&i<all.length-1)focusEl(all[i+1],true);else e.target.blur();
      return;
    }
    const p=$('#sheet [data-primary]');if(p)p.click();
  }
});
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitSheet);window.visualViewport.addEventListener('scroll',fitSheet);}
let rz;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.ready){const pts=rangePoints();$$('#view [data-chart]').forEach(el=>drawChart(el,pts));}},150);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ready)render();});
window.addEventListener('online',()=>{syncUpdate();if(S.ready)render();});
window.addEventListener('offline',()=>{syncUpdate();if(S.ready)render();});

/* ================= boot ================= */
function wantsQuickAdd(){
  const hit=s=>/(?:^|[?&#])quickadd(?:=(?:1|true|yes))?(?:$|[&#])/i.test(s||'');
  try{if(hit(location.search)||hit(location.hash))return true;}catch(e){}
  try{if(document.referrer){const u=new URL(document.referrer);if(hit(u.search)||hit(u.hash))return true;}}catch(e){}
  return false;
}
(async function init(){
  S.quick=wantsQuickAdd();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{await D.init();}
  catch(e){
    console.error(e);
    $('#view').innerHTML='<div class="surface empty">לא ניתן לטעון את Firebase. בדקו את החיבור לאינטרנט ורעננו.</div>';
    return;
  }
  D.onAuth(user=>{
    D.stop();
    if(!user){S.user=null;S.ready=false;S.noAccess=false;showAuth('in');return;}
    S.user=user;
    if(!user.emailVerified){showVerify(user);return;}
    enter(user);
  });
})();
})();
